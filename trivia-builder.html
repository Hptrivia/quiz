<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia Builder (Local)</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg:#0f1115; --bg-alt:#161923; --panel:#1b1f2b; --panel-alt:#22273a;
    --border:#2c3244; --border-light:#3a4160;
    --text:#e8eaf2; --text-dim:#9aa1b8; --text-faint:#6b7291;
    --accent:#7c9cff; --accent-dim:#3d4c8a;
    --green:#4ade80; --green-dim:#1e4030;
    --red:#f87171; --red-dim:#3a1f22;
    --yellow:#fbbf24; --orange:#fb923c;
    --easy:#4ade80; --medium:#fbbf24; --hard:#f87171;
    --radius:10px; --radius-sm:6px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-dim);}

  /* ---------- Layout shells ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:12px 20px; background:rgba(15,17,21,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand{font-weight:700; font-size:15px; letter-spacing:.02em; color:var(--text);}
  .topbar .brand span{color:var(--accent);}
  .topbar nav{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap;}
  .container{max-width:1100px; margin:0 auto; padding:24px 20px 80px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--panel-alt); color:var(--text); font-size:13.5px; font-weight:500;
    transition:background .12s, border-color .12s, transform .06s;
    white-space:nowrap;
  }
  .btn:hover{background:#2a3049; border-color:var(--accent-dim);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#10131c; font-weight:700;}
  .btn-primary:hover{background:#93aeff;}
  .btn-danger{border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:var(--red-dim);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--panel-alt);}
  .btn-sm{padding:5px 10px; font-size:12.5px;}
  .btn.active{background:var(--accent); border-color:var(--accent); color:#10131c; font-weight:700;}

  /* ---------- Home ---------- */
  .home-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .home-head h1{font-size:22px; margin:0;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
  .settings-panel{margin-bottom:26px;}
  .settings-panel h2{font-size:14px; margin:0 0 12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
  .settings-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .settings-row input[type=password], .settings-row input[type=text], .settings-row select{
    flex:1 1 260px; min-width:180px; padding:9px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); font-size:13.5px;
  }
  .settings-row select{flex:0 0 220px;}
  .settings-hint{font-size:12px; color:var(--text-faint); margin-top:8px; line-height:1.5;}
  .save-flash{color:var(--green); font-size:12.5px; margin-left:4px; opacity:0; transition:opacity .2s;}
  .save-flash.show{opacity:1;}

  .project-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .project-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; text-align:left; display:flex; flex-direction:column; gap:10px;
    transition:border-color .12s, transform .06s;
  }
  .project-card:hover{border-color:var(--accent-dim); transform:translateY(-1px);}
  .project-card .pname{font-weight:700; font-size:15.5px;}
  .project-card .pstats{display:flex; gap:14px; font-size:12.5px; color:var(--text-dim);}
  .project-card .pstats b{color:var(--text);}
  .empty-state{color:var(--text-faint); font-size:13.5px; padding:40px 0; text-align:center;}

  /* ---------- Import page ---------- */
  .import-wrap{display:flex; flex-direction:column; gap:14px;}
  textarea.json-input{
    width:100%; min-height:320px; padding:14px; border-radius:var(--radius);
    border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:1.5; resize:vertical;
  }
  .import-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .import-msg{font-size:13.5px; padding:8px 0;}
  .import-msg.ok{color:var(--green);}
  .import-msg.err{color:var(--red);}

  /* ---------- Review toolbar ---------- */
  .review-toolbar{
    position:sticky; top:53px; z-index:15; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--bg); padding:10px 0 14px; border-bottom:1px solid var(--border); margin-bottom:16px;
  }
  .filter-group{display:flex; gap:6px; flex-wrap:wrap;}
  .toolbar-spacer{flex:1;}
  .count-pill{font-size:12px; color:var(--text-faint); padding:4px 2px;}

  /* ---------- Question cards ---------- */
  .qlist{display:flex; flex-direction:column; gap:12px;}
  .qcard{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .qcard.approved{border-color:var(--green-dim);}
  .qcard-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .qnum{font-size:12px; color:var(--text-faint); font-weight:700;}
  .qtext{font-size:15.5px; font-weight:600; line-height:1.4; margin:2px 0 10px;}
  .badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
  .badge.status-pending{background:#3a3320; color:var(--yellow);}
  .badge.status-approved{background:var(--green-dim); color:var(--green);}
  .badge.diff-easy{background:#173321; color:var(--easy);}
  .badge.diff-medium{background:#3a3320; color:var(--medium);}
  .badge.diff-hard{background:#3a1f22; color:var(--hard);}
  select.diff-select{
    background:var(--bg-alt); color:var(--text); border:1px solid var(--border-light);
    border-radius:20px; font-size:11px; font-weight:700; padding:3px 8px; text-transform:uppercase;
  }

  .options-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;}
  .opt{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
    background:var(--bg-alt); border:1px solid var(--border); font-size:13.5px;
  }
  .opt.correct{border-color:var(--green); background:var(--green-dim); color:var(--green);}
  .opt .check{color:var(--green); font-weight:900;}

  .qactions{display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:12px;}

  /* ---------- Edit mode ---------- */
  .edit-block{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .edit-block textarea, .edit-block input[type=text]{
    width:100%; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--bg-alt); color:var(--text); font-size:13.5px;
  }
  .edit-opt-row{display:flex; align-items:center; gap:8px;}
  .edit-opt-row input[type=radio]{accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}
  .edit-meta-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .edit-meta-row select{padding:7px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); font-size:13px;}

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,7,10,.72); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    width:100%; max-width:640px; max-height:85vh; display:flex; flex-direction:column;
    box-shadow:var(--shadow);
  }
  .modal.wide{max-width:820px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0; font-size:15.5px;}
  .modal-body{padding:18px 20px; overflow-y:auto; flex:1;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end;}

  /* chat */
  .chat-log{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .chat-msg{padding:10px 13px; border-radius:var(--radius-sm); font-size:13.5px; line-height:1.5; max-width:88%;}
  .chat-msg.user{background:var(--accent-dim); align-self:flex-end; color:#dfe6ff;}
  .chat-msg.ai{background:var(--panel-alt); align-self:flex-start; border:1px solid var(--border);}
  .chat-msg.error{background:var(--red-dim); color:var(--red); align-self:stretch;}
  .chat-input-row{display:flex; gap:8px;}
  .chat-input-row textarea{flex:1; min-height:52px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); resize:vertical; font-size:13.5px;}
  .chat-context{font-size:12px; color:var(--text-faint); background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:14px;}
  .spinner{display:inline-block; width:13px; height:13px; border:2px solid var(--text-faint); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .export-json{width:100%; min-height:340px; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--bg-alt); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;}

  .trash-list{display:flex; flex-direction:column; gap:8px;}
  .trash-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius-sm);}
  .trash-item .ttext{font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-alt); border:1px solid var(--border-light);
    padding:10px 18px; border-radius:30px; font-size:13px; z-index:200; box-shadow:var(--shadow);}

  @media (max-width:640px){
    .options-grid{grid-template-columns:1fr;}
    .settings-row select{flex:1 1 100%;}
    .review-toolbar{top:49px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* =========================================================================
   TRIVIA BUILDER — single-file local app
   Persistence: localStorage only. AI calls: Anthropic Messages API via the
   official SDK, loaded from a CDN and run in-browser (dangerouslyAllowBrowser).
   ========================================================================= */
import Anthropic from "https://esm.sh/@anthropic-ai/sdk";

/* ---------------------------------------------------------------------
   Storage
--------------------------------------------------------------------- */
const STORAGE_KEY = "triviaBuilderState_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("Failed to parse saved state, starting fresh.", e); }
  return { apiKey:"", model:"claude-opus-5", projects:{} };
}
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

const state = loadState();

// Ephemeral UI/nav state — not persisted.
const ui = {
  view: "home",            // 'home' | 'import' | 'review'
  projectId: null,
  filter: "pending",        // pending | approved | easy | medium | hard
  editingId: null,          // question id currently in edit mode
  chatQuestionId: null,     // question id whose AI Chat modal is open
  chatDraft: "",
  chatBusy: false,
  optionsBusyId: null,      // question id currently running "AI Options"
  rephraseBusyId: null,     // question id currently running "Rephrase"
  showTrash: false,
  showExport: false,
  newProjectOpen: false,
  toast: null,
};

// Per-project undo/redo history — kept in memory only (last ~10 actions).
const historyMap = {}; // { [projectId]: { undo:[snapshot,...], redo:[snapshot,...] } }
function getHistory(pid){
  if(!historyMap[pid]) historyMap[pid] = { undo:[], redo:[] };
  return historyMap[pid];
}
function snapshot(project){
  return { questions: structuredClone(project.questions), trash: structuredClone(project.trash) };
}
function pushUndo(project){
  const h = getHistory(project.id);
  h.undo.push(snapshot(project));
  if(h.undo.length > 10) h.undo.shift();
  h.redo.length = 0; // any new action invalidates redo history
}
function undo(project){
  const h = getHistory(project.id);
  if(!h.undo.length) return;
  h.redo.push(snapshot(project));
  const prev = h.undo.pop();
  project.questions = prev.questions;
  project.trash = prev.trash;
  persist();
}
function redo(project){
  const h = getHistory(project.id);
  if(!h.redo.length) return;
  h.undo.push(snapshot(project));
  const next = h.redo.pop();
  project.questions = next.questions;
  project.trash = next.trash;
  persist();
}

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function uid(){ return crypto.randomUUID(); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function getProject(id){ return state.projects[id]; }
function showToast(msg){
  ui.toast = msg;
  render();
  setTimeout(()=>{ ui.toast = null; render(); }, 2600);
}

/* ---------------------------------------------------------------------
   AI layer
--------------------------------------------------------------------- */
// Every AI action (chat / options / rephrase) returns JSON matching this
// shape via structured outputs, so we never depend on free-form parsing.
const UPDATE_SCHEMA = {
  type: "object",
  properties: {
    explanation: { type: "string", description: "Brief explanation of what changed and why. Always include this." },
    question: { type: "string", description: "New question text, only if it changed." },
    options: { type: "array", items: { type: "string" }, description: "The full new set of 4 options, only if any changed." },
    answer: { type: "string", description: "The correct answer, only if it changed. Must exactly match one of the returned/kept options." },
    difficulty: { type: "string", enum: ["easy","medium","hard"], description: "Only if it changed." }
  },
  required: ["explanation"],
  additionalProperties: false
};

function getClient(){
  if(!state.apiKey) throw new Error("NO_KEY");
  return new Anthropic({ apiKey: state.apiKey, dangerouslyAllowBrowser: true });
}

async function askAI(systemPrompt, messages){
  const client = getClient();
  const response = await client.messages.create({
    model: state.model || "claude-opus-5",
    max_tokens: 1536,
    system: systemPrompt,
    messages,
    output_config: { format: { type: "json_schema", schema: UPDATE_SCHEMA } }
  });
  const textBlock = response.content.find(b => b.type === "text");
  if(!textBlock) throw new Error("No text response from model.");
  return { parsed: JSON.parse(textBlock.text), rawContent: response.content };
}

function aiErrorMessage(err){
  if(err && err.message === "NO_KEY") return "Set your Claude API key on the Home page first.";
  if(err && err.status === 401) return "Invalid API key.";
  if(err && err.status === 429) return "Rate limited — wait a moment and try again.";
  if(err && err.status) return `API error (${err.status}): ${err.message || "unknown"}`;
  return `Request failed: ${err?.message || err}`;
}

function questionContextBlock(project, q){
  return [
    `Show/movie/series: ${project.name}`,
    `Question: ${q.question}`,
    `Options: ${q.options.map((o,i)=>`${i+1}. ${o}`).join(" | ")}`,
    `Correct answer: ${q.answer}`,
    `Difficulty: ${q.difficulty}`
  ].join("\n");
}

/* AI Options — regenerate believable distractors, keep question + answer fixed. */
async function runAiOptions(project, q){
  ui.optionsBusyId = q.id; render();
  const system = `You improve the WRONG answer choices (distractors) for a single trivia question from the show/movie/series "${project.name}".
Rules:
- Do NOT change the question text.
- Do NOT change the correct answer.
- Replace the 3 incorrect options with new ones that are believable and contextually appropriate.
- Match the style, language/culture of origin, gender, and setting of the correct answer. Example: if the answer is a Chinese character's name, use other believable Chinese names, not random English ones. If the answer is a male character, don't fill distractors only with female characters. If the setting is a fantasy world, use plausible fantasy names.
- Distractors may be a mix of real characters/entities from the show and convincing fictional ones, as long as they feel fair.
- Return the FULL new set of 4 options (including the unchanged correct answer, in any position) in the "options" field.
- In "explanation", state which options you removed, what you replaced them with, and why the new set is an improvement.
Context:
${questionContextBlock(project, q)}`;
  try{
    const { parsed } = await askAI(system, [{ role:"user", content:"Generate improved distractor options now." }]);
    if(!parsed.options || !parsed.options.includes(q.answer)){
      showToast("AI response didn't preserve the correct answer — no changes applied.");
      return;
    }
    pushUndo(project);
    q.options = parsed.options;
    persist();
    showToast(parsed.explanation || "Options updated.");
  }catch(err){
    showToast(aiErrorMessage(err));
  }finally{
    ui.optionsBusyId = null; render();
  }
}

/* Rephrase — natural English, meaning/answer/options untouched. */
async function runRephrase(project, q){
  ui.rephraseBusyId = q.id; render();
  const system = `You rewrite an awkwardly-phrased trivia question into natural, fluent English for the show/movie/series "${project.name}".
Rules:
- Preserve the exact meaning and factual content.
- Do NOT change the correct answer.
- Do NOT change the options.
- Only return the "question" field with the rewritten text, plus "explanation".
Context:
${questionContextBlock(project, q)}`;
  try{
    const { parsed } = await askAI(system, [{ role:"user", content:"Rephrase this question now." }]);
    if(!parsed.question){ showToast("AI did not return a rephrased question."); return; }
    pushUndo(project);
    q.question = parsed.question;
    persist();
    showToast(parsed.explanation || "Question rephrased.");
  }catch(err){
    showToast(aiErrorMessage(err));
  }finally{
    ui.rephraseBusyId = null; render();
  }
}

/* AI Chat — free-form multi-turn editing of a single question. */
function chatSystemPrompt(project, q){
  return `You are helping refine ONE trivia question for the show/movie/series "${project.name}". You are not aware of any other questions in the project — only this one.
Current state:
${questionContextBlock(project, q)}
The user will ask for changes (rewrite the question, replace an option, change the correct answer, make it harder/easier, rewrite all options, etc.). Apply the change immediately by including only the field(s) that changed in your JSON response (question / options / answer / difficulty). If options are returned, return the full set of 4. Always fill "explanation" with a short note on what you changed. If the user is just asking a question or chatting without requesting a change, leave the edit fields out and just answer in "explanation".`;
}

async function sendChatMessage(project, q, userText){
  if(!userText.trim()) return;
  q.chat = q.chat || [];
  q.chat.push({ role:"user", text:userText });
  ui.chatBusy = true; ui.chatDraft = ""; render();
  try{
    // Replay prior turns as plain text so the model has full context of the thread.
    const history = q.chat.slice(0,-1).map(m => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.role === "user" ? m.text : JSON.stringify({ explanation: m.text, ...(m.applied||{}) })
    }));
    const messages = [...history, { role:"user", content:userText }];
    const { parsed } = await askAI(chatSystemPrompt(project, q), messages);

    const applied = {};
    pushUndo(project);
    if(parsed.question){ q.question = parsed.question; applied.question = parsed.question; }
    if(parsed.options){ q.options = parsed.options; applied.options = parsed.options; }
    if(parsed.answer){ q.answer = parsed.answer; applied.answer = parsed.answer; }
    if(parsed.difficulty){ q.difficulty = parsed.difficulty; applied.difficulty = parsed.difficulty; }
    persist();

    q.chat.push({ role:"ai", text: parsed.explanation || "Done.", applied });
  }catch(err){
    q.chat.push({ role:"error", text: aiErrorMessage(err) });
    // Undo the speculative user push's paired state push isn't needed — nothing was applied.
  }finally{
    ui.chatBusy = false; persist(); render();
  }
}

/* ---------------------------------------------------------------------
   Mutating actions (question lifecycle)
--------------------------------------------------------------------- */
function approveQuestion(project, id){
  const q = project.questions.find(x=>x.id===id);
  if(!q) return;
  pushUndo(project);
  q.status = "approved";
  persist(); render();
}
function deleteQuestion(project, id){
  const idx = project.questions.findIndex(x=>x.id===id);
  if(idx===-1) return;
  pushUndo(project);
  const [q] = project.questions.splice(idx,1);
  project.trash.push(q);
  persist(); render();
}
function restoreQuestion(project, id){
  const idx = project.trash.findIndex(x=>x.id===id);
  if(idx===-1) return;
  pushUndo(project);
  const [q] = project.trash.splice(idx,1);
  project.questions.push(q);
  persist(); render();
}
function clearTrash(project){
  if(!project.trash.length) return;
  if(!confirm(`Permanently delete ${project.trash.length} question(s) in Trash? This cannot be undone.`)) return;
  pushUndo(project);
  project.trash = [];
  persist(); render();
}
function setDifficulty(project, id, difficulty){
  const q = project.questions.find(x=>x.id===id);
  if(!q) return;
  pushUndo(project);
  q.difficulty = difficulty;
  persist(); render();
}
function saveEdit(project, id, fields){
  const q = project.questions.find(x=>x.id===id);
  if(!q) return;
  pushUndo(project);
  Object.assign(q, fields, { status:"approved" });
  ui.editingId = null;
  persist(); render();
}

/* ---------------------------------------------------------------------
   Import
--------------------------------------------------------------------- */
function importQuestions(project, rawText){
  let data;
  try{ data = JSON.parse(rawText); }
  catch(e){ return { ok:false, message:"Invalid JSON — please check the pasted text." }; }
  const arr = Array.isArray(data) ? data : (Array.isArray(data?.questions) ? data.questions : null);
  if(!arr) return { ok:false, message:"Expected a JSON array of question objects." };

  const valid = [];
  for(const item of arr){
    if(!item || typeof item.question !== "string" || !Array.isArray(item.options) || item.options.length < 2) continue;
    if(typeof item.answer !== "string") continue;
    valid.push({
      id: uid(),
      question: item.question,
      options: item.options.slice(0,4),
      answer: item.answer,
      difficulty: ["easy","medium","hard"].includes(item.difficulty) ? item.difficulty : "medium",
      status: "pending",
      chat: []
    });
  }
  if(!valid.length) return { ok:false, message:"No valid questions found in that JSON." };

  pushUndo(project);
  project.questions.push(...valid);
  persist();
  return { ok:true, message:`${valid.length} question${valid.length===1?"":"s"} uploaded.` };
}

/* ---------------------------------------------------------------------
   Export
--------------------------------------------------------------------- */
function buildExportJson(project){
  const approved = project.questions.filter(q => q.status === "approved");
  const out = approved.map((q,i) => ({
    id: i+1,
    question: q.question,
    options: q.options,
    answer: q.answer,
    difficulty: q.difficulty
  }));
  return JSON.stringify(out, null, 2);
}

/* ---------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------- */
const app = document.getElementById("app");

function render(){
  let html = "";
  if(ui.view === "home") html = renderHome();
  else if(ui.view === "import") html = renderImport();
  else if(ui.view === "review") html = renderReview();

  html += renderModals();
  if(ui.toast) html += `<div class="toast">${esc(ui.toast)}</div>`;

  app.innerHTML = html;
  bindEvents();
}

function topbar(activeProjectName){
  const pid = ui.projectId;
  return `
  <div class="topbar">
    <div class="brand">🎯 Trivia <span>Builder</span>${activeProjectName ? ` <span style="color:var(--text-faint); font-weight:400;">/ ${esc(activeProjectName)}</span>` : ""}</div>
    <nav>
      <button class="btn btn-ghost" data-action="go-home">Home</button>
      ${pid ? `<button class="btn btn-ghost" data-action="go-import">Import</button>` : ""}
      ${pid ? `<button class="btn btn-ghost" data-action="go-review">Review</button>` : ""}
    </nav>
  </div>`;
}

}

/* ---------- Review ---------- */
const FILTERS = [
  { key:"pending", label:"Pending" },
  { key:"approved", label:"Approved" },
  { key:"easy", label:"Easy" },
  { key:"medium", label:"Medium" },
  { key:"hard", label:"Hard" },
];

function filteredQuestions(project){
  return project.questions.filter(q=>{
    if(ui.filter==="pending") return q.status==="pending";
    if(ui.filter==="approved") return q.status==="approved";
    return q.difficulty===ui.filter;
  });
}

function renderReview(){
  const project = getProject(ui.projectId);
  if(!project) return renderHome();
  const h = getHistory(project.id);
  const list = filteredQuestions(project);
  const pendingCount = project.questions.filter(q=>q.status==="pending").length;
  const approvedCount = project.questions.filter(q=>q.status==="approved").length;

  return `
  ${topbar(project.name)}
  <div class="container">
    <div class="review-toolbar">
      <div class="filter-group">
        ${FILTERS.map(f=>`<button class="btn btn-sm ${ui.filter===f.key?"active":""}" data-action="set-filter" data-filter="${f.key}">${f.label}</button>`).join("")}
      </div>
      <span class="count-pill">${pendingCount} pending · ${approvedCount} approved</span>
      <div class="toolbar-spacer"></div>
      <button class="btn btn-sm" data-action="undo" ${h.undo.length? "":"disabled"}>↶ Undo</button>
      <button class="btn btn-sm" data-action="redo" ${h.redo.length? "":"disabled"}>↷ Redo</button>
      <button class="btn btn-sm" data-action="open-trash">🗑 Trash (${project.trash.length})</button>
      <button class="btn btn-sm btn-primary" data-action="open-export">View / Export</button>
    </div>

    <div class="qlist">
      ${list.length ? list.map((q,i)=>renderQuestionCard(project, q, i)).join("") : `<div class="empty-state">No questions match this filter.</div>`}
    </div>
  </div>`;
}

function renderQuestionCard(project, q, idx){
  const editing = ui.editingId === q.id;
  const busyOptions = ui.optionsBusyId === q.id;
  const busyRephrase = ui.rephraseBusyId === q.id;

  if(editing){
    return `
    <div class="qcard ${q.status}">
      <div class="qcard-head"><span class="qnum">#${idx+1}</span></div>
      <div class="edit-block">
        <textarea rows="2" id="edit-q-${q.id}">${esc(q.question)}</textarea>
        ${q.options.map((o,i)=>`
          <div class="edit-opt-row">
            <input type="radio" name="edit-answer-${q.id}" value="${i}" ${o===q.answer?"checked":""}>
            <input type="text" id="edit-opt-${q.id}-${i}" value="${esc(o)}">
          </div>`).join("")}
        <div class="edit-meta-row">
          <label style="font-size:12.5px; color:var(--text-dim);">Difficulty
            <select id="edit-diff-${q.id}">
              <option value="easy" ${q.difficulty==="easy"?"selected":""}>Easy</option>
              <option value="medium" ${q.difficulty==="medium"?"selected":""}>Medium</option>
              <option value="hard" ${q.difficulty==="hard"?"selected":""}>Hard</option>
            </select>
          </label>
        </div>
      </div>
      <div class="qactions">
        <button class="btn btn-primary btn-sm" data-action="save-edit" data-id="${q.id}">💾 Save</button>
        <button class="btn btn-ghost btn-sm" data-action="cancel-edit" data-id="${q.id}">Cancel</button>
      </div>
    </div>`;
  }

  return `
  <div class="qcard ${q.status}">
    <div class="qcard-head">
      <span class="qnum">#${idx+1}</span>
      <div class="badges">
        <span class="badge status-${q.status}">${q.status}</span>
        <select class="diff-select" data-action="set-difficulty" data-id="${q.id}">
          <option value="easy" ${q.difficulty==="easy"?"selected":""}>EASY</option>
          <option value="medium" ${q.difficulty==="medium"?"selected":""}>MEDIUM</option>
          <option value="hard" ${q.difficulty==="hard"?"selected":""}>HARD</option>
        </select>
      </div>
    </div>
    <div class="qtext">${esc(q.question)}</div>
    <div class="options-grid">
      ${q.options.map(o=>`
        <div class="opt ${o===q.answer?"correct":""}">
          ${o===q.answer?'<span class="check">✓</span>':""}
          <span>${esc(o)}</span>
        </div>`).join("")}
    </div>
    <div class="qactions">
      <button class="btn btn-sm" data-action="edit" data-id="${q.id}">✏️ Edit</button>
      <button class="btn btn-sm" data-action="open-chat" data-id="${q.id}">💬 AI Chat</button>
      <button class="btn btn-sm" data-action="ai-options" data-id="${q.id}" ${busyOptions?"disabled":""}>${busyOptions?'<span class="spinner"></span>':"🎯"} AI Options</button>
      <button class="btn btn-sm" data-action="rephrase" data-id="${q.id}" ${busyRephrase?"disabled":""}>${busyRephrase?'<span class="spinner"></span>':"🪄"} Rephrase</button>
      <button class="btn btn-sm" data-action="google" data-id="${q.id}">🔎 Google</button>
      <button class="btn btn-sm btn-danger" data-action="delete" data-id="${q.id}">🗑 Delete</button>
      ${q.status==="pending" ? `<button class="btn btn-sm btn-primary" data-action="approve" data-id="${q.id}">✓ Approve</button>` : ""}
    </div>
  </div>`;
}

/* ---------- Modals ---------- */
function renderModals(){
  let out = "";
  if(ui.newProjectOpen) out += renderNewProjectModal();
  if(ui.showTrash) out += renderTrashModal();
  if(ui.showExport) out += renderExportModal();
  if(ui.chatQuestionId) out += renderChatModal();
  return out;
}

  <div class="overlay" data-action="close-modal-bg">
    <div class="modal" style="max-width:420px;">
      <div class="modal-head"><h3>New Project</h3><button class="btn btn-ghost btn-sm" data-action="close-new-project">✕</button></div>
      <div class="modal-body">
        <label style="font-size:12.5px; color:var(--text-dim);">TV show / movie / series name</label>
        <input type="text" id="newProjectName" placeholder="e.g. Breaking Bad" style="width:100%; margin-top:6px; padding:9px 11px; border-radius:6px; border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); font-size:14px;">
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-action="close-new-project">Cancel</button>
        <button class="btn btn-primary" data-action="create-project">Create</button>

}

function renderTrashModal(){
  const project = getProject(ui.projectId);
  return `
  <div class="overlay" data-action="close-modal-bg">
    <div class="modal">
      <div class="modal-head"><h3>Trash (${project.trash.length})</h3><button class="btn btn-ghost btn-sm" data-action="close-trash">✕</button></div>

function renderExportModal(){
  const project = getProject(ui.projectId);
  const json = buildExportJson(project);
  const approvedCount = project.questions.filter(q=>q.status==="approved").length;
  return `
  <div class="overlay" data-action="close-modal-bg">
    <div class="modal wide">
      <div class="modal-head"><h3>Export (${approvedCount} approved)</h3><button class="btn btn-ghost btn-sm" data-action="close-export">✕</button></div>
      <div class="modal-body">
        ${approvedCount ? `<textarea class="export-json" readonly>${esc(json)}</textarea>` : `<div class="empty-state">No approved questions yet.</div>`}
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" data-action="copy-export" ${approvedCount? "":"disabled"}>📋 Copy JSON</button>
        <button class="btn" data-action="close-export">Close</button>
      </div>
    </div>
  </div>`;
}

function renderChatModal(){
  const project = getProject(ui.projectId);
  const q = project.questions.find(x=>x.id===ui.chatQuestionId);
  if(!q) return "";
  const chat = q.chat || [];
  return `
  <div class="overlay" data-action="close-modal-bg">
    <div class="modal wide">
      <div class="modal-head"><h3>AI Chat — Question</h3><button class="btn btn-ghost btn-sm" data-action="close-chat">✕</button></div>
      <div class="modal-body">
        <div class="chat-context"><b>${esc(project.name)}</b> — ${esc(q.question)}</div>
        <div class="chat-log">
          ${chat.length ? chat.map(m=>`
            <div class="chat-msg ${m.role}">${esc(m.text)}</div>
          `).join("") : `<div style="color:var(--text-faint); font-size:13px;">Ask for a rewrite, a new option, a difficulty change, or anything else about this question.</div>`}
          ${ui.chatBusy ? `<div class="chat-msg ai"><span class="spinner"></span>Thinking…</div>` : ""}
        </div>
      </div>
      <div class="modal-foot" style="flex-direction:column; align-items:stretch;">
        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="e.g. Make this harder, and replace option C" ${ui.chatBusy?"disabled":""}>${esc(ui.chatDraft)}</textarea>
          <button class="btn btn-primary" data-action="send-chat" ${ui.chatBusy?"disabled":""}>Send</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Event delegation
--------------------------------------------------------------------- */
function bindEvents(){
  app.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", onAction);
  });
  const settingsBtn = document.getElementById("saveFlash");
  const apiKeyInput = document.getElementById("apiKeyInput");
  if(apiKeyInput){
    apiKeyInput.addEventListener("keydown", e=>{ if(e.key==="Enter") saveSettings(); });
  }
  const chatInput = document.getElementById("chatInput");
  if(chatInput){
    chatInput.addEventListener("input", e=>{ ui.chatDraft = e.target.value; });
    chatInput.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); triggerSendChat(); }
    });
    chatInput.focus();
    chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
  }
  const importText = document.getElementById("importText");
  if(importText) importText.addEventListener("input", e=>{ ui._importDraft = e.target.value; });
  const newProjName = document.getElementById("newProjectName");
  if(newProjName){
    newProjName.focus();
    newProjName.addEventListener("keydown", e=>{ if(e.key==="Enter") createProject(); });
  }
  document.querySelectorAll(".diff-select").forEach(sel=>{
    sel.addEventListener("click", e=>e.stopPropagation());
    sel.addEventListener("change", e=>{
      const project = getProject(ui.projectId);
      setDifficulty(project, sel.dataset.id, sel.value);
    });
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const project = ui.projectId ? getProject(ui.projectId) : null;

  switch(action){
    case "go-home": ui.view="home"; ui.projectId=null; render(); break;
    case "go-import": ui.view="import"; render(); break;
    case "go-review": ui.view="review"; render(); break;
    case "open-project": ui.projectId = id; ui.view="review"; ui.filter="pending"; render(); break;

    case "new-project": ui.newProjectOpen = true; render(); break;
    case "close-new-project": ui.newProjectOpen = false; render(); break;
    case "create-project": createProject(); break;

    case "save-settings": saveSettings(); break;

    case "upload": doUpload(project); break;

    case "set-filter": ui.filter = el.dataset.filter; render(); break;
    case "undo": undo(project); render(); break;
    case "redo": redo(project); render(); break;

    case "edit": ui.editingId = id; render(); break;
    case "cancel-edit": ui.editingId = null; render(); break;
    case "save-edit": doSaveEdit(project, id); break;

    case "approve": approveQuestion(project, id); afterListAction(); break;
    case "delete": deleteQuestion(project, id); afterListAction(); break;
    case "restore": restoreQuestion(project, id); render(); break;

    case "ai-options": { const q = project.questions.find(x=>x.id===id); runAiOptions(project, q); break; }
    case "rephrase": { const q = project.questions.find(x=>x.id===id); runRephrase(project, q); break; }

    case "google": { const q = project.questions.find(x=>x.id===id);
      window.open(`https://www.google.com/search?q=${encodeURIComponent(q.question + " " + project.name)}`, "_blank", "noopener");
      break; }

    case "open-chat": ui.chatQuestionId = id; ui.chatDraft = ""; render(); break;
    case "close-chat": ui.chatQuestionId = null; render(); break;
    case "send-chat": triggerSendChat(); break;

    case "open-trash": ui.showTrash = true; render(); break;
    case "close-trash": ui.showTrash = false; render(); break;
    case "clear-trash": clearTrash(project); render(); break;

    case "open-export": ui.showExport = true; render(); break;
    case "close-export": ui.showExport = false; render(); break;
    case "copy-export": doCopyExport(project); break;

    case "close-modal-bg":
      if(e.target === el){
        ui.newProjectOpen = false; ui.showTrash = false; ui.showExport = false; ui.chatQuestionId = null;
        render();
      }
      break;
  }
}

function afterListAction(){
  render();
  if(ui.filter==="pending"){
    const first = app.querySelector(".qcard");
    if(first) first.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}

function createProject(){
  const input = document.getElementById("newProjectName");
  const name = (input?.value || "").trim();
  if(!name) return;
  const id = uid();
  state.projects[id] = { id, name, createdAt: Date.now(), questions: [], trash: [] };
  persist();
  ui.newProjectOpen = false;
  ui.projectId = id;
  ui.view = "import";
  render();
}

function saveSettings(){
  const key = document.getElementById("apiKeyInput")?.value.trim() || "";
  const model = document.getElementById("modelSelect")?.value || "claude-opus-5";
  state.apiKey = key;
  state.model = model;
  persist();
  const flash = document.getElementById("saveFlash");
  if(flash){ flash.classList.add("show"); setTimeout(()=>flash.classList.remove("show"), 1500); }
}

function doUpload(project){
  const text = document.getElementById("importText")?.value || "";
  const result = importQuestions(project, text);
  const msgEl = document.getElementById("importMsg");
  if(msgEl){
    msgEl.innerHTML = `<div class="import-msg ${result.ok?"ok":"err"}">${esc(result.message)}</div>`;
  }
}

function doSaveEdit(project, id){
  const question = document.getElementById(`edit-q-${id}`).value.trim();
  const options = [0,1,2,3].map(i => document.getElementById(`edit-opt-${id}-${i}`)?.value.trim()).filter(Boolean);
  const answerIdx = document.querySelector(`input[name="edit-answer-${id}"]:checked`)?.value;
  const difficulty = document.getElementById(`edit-diff-${id}`).value;
  if(!question || options.length < 2 || answerIdx === undefined){
    showToast("Question needs text, at least 2 options, and a selected correct answer.");
    return;
  }
  const answer = options[Number(answerIdx)];
  saveEdit(project, id, { question, options, answer, difficulty });
  afterListAction();
}

function triggerSendChat(){
  const project = getProject(ui.projectId);
  const q = project.questions.find(x=>x.id===ui.chatQuestionId);
  const input = document.getElementById("chatInput");
  const text = input ? input.value : ui.chatDraft;
  if(!text || !text.trim()) return;
  sendChatMessage(project, q, text);
}

async function doCopyExport(project){
  const json = buildExportJson(project);
  try{
    await navigator.clipboard.writeText(json);
    showToast("Copied to clipboard.");
  }catch(e){
    showToast("Couldn't access clipboard — select and copy manually.");
  }
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
render();
</script>

</html>
