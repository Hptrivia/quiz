function createProject(){
  const input = document.getElementById("newProjectName");
  const name = (input?.value || "").trim();
  if(!name) return;
  const id = uid();
  state.projects[id] = { id, name, createdAt: Date.now(), questions: [], trash: [], manualDraft: "", transcriptDraft: "", archived: false };
  persist();
  ui.newProjectOpen = false;
  ui.projectId = id;
  ui.view = "import";
  render();
}

function deleteProject(id){
  const project = state.projects[id];
  if(!project) return;
  if(!confirm(`Delete project "${project.name}" and all ${project.questions.length + project.trash.length} of its questions? This cannot be undone.`)) return;
  delete state.projects[id];
  delete historyMap[id];
  persist();
  if(ui.projectId === id){ ui.projectId = null; ui.view = "home"; }
  render();
}

function archiveProject(id){
  const project = state.projects[id];
  if(!project) return;
  project.archived = true;
  persist();
  if(ui.projectId === id){ ui.projectId = null; ui.view = "home"; }
  render();
}
function unarchiveProject(id){
  const project = state.projects[id];
  if(!project) return;
  project.archived = false;
  persist(); render();
}

async function generateManualQuestions(project){
  const textEl = document.getElementById("manualAddText");
  const text = ((textEl ? textEl.value : project.manualDraft) || "").trim();
  if(!text){ showToast("Nothing to generate — type some questions first."); return; }
  project.manualDraft = text;
  clearTimeout(draftSaveTimer);
  persist();

  ui.manualAddBusy = true; render();
  const system = `You convert a person's rough notes into structured trivia questions about the show/movie/series "${project.name}".

The user pastes freeform, messy text containing one or more trivia questions, loosely separated by blank lines or line breaks. Read it loosely — do not require any particular format. For each question you can identify:
- The question text itself is whatever they wrote as the question.
- They MAY also write the correct answer (often on the next line) — if present, use it exactly. If absent, figure out the correct answer yourself from your own knowledge of "${project.name}".
- They MAY also write a difficulty (easy/medium/hard) — if present, use it. If absent, judge it yourself.
- They will almost never write the 3 wrong-answer options — always generate 3 new, believable, contextually appropriate wrong options yourself (matching the style/culture/gender/setting of the correct answer), even if they gave one.

Be lenient — this is rough freeform text, not a strict format. Do your best to split it into separate questions and don't reject anything just because it's messy or incomplete. Skip only text that isn't a trivia question at all.

Return every question you can identify, each with "question", exactly 4 "options" (including the correct one, in any position), "answer" (must exactly match one of the 4 options), and "difficulty".${styleNotesBlock()}`;

  try{
    const client = getClient();
    const response = await client.messages.create({
      model: "claude-sonnet-5",
      max_tokens: 4096,
      thinking: { type: "disabled" },
      system,
      messages: [{ role:"user", content: text }],
      output_config: { format: { type:"json_schema", schema: MANUAL_ADD_SCHEMA } }
    });
    const textBlock = response.content.find(b=>b.type==="text");
    if(!textBlock) throw new Error("No response from model.");
    const parsed = JSON.parse(textBlock.text);
    const items = Array.isArray(parsed.questions) ? parsed.questions : [];
    const valid = items.filter(it => it && typeof it.question==="string" && Array.isArray(it.options) && it.options.length>=2 && typeof it.answer==="string");

    if(!valid.length){
      showToast("Couldn't find any questions in that text.");
      ui.manualAddBusy = false; render();
      return;
    }

    pushUndo(project);
    for(const it of valid){
      project.questions.push({
        id: uid(),
        question: it.question,
        options: it.options.slice(0,4),
        answer: it.answer,
        difficulty: ["easy","medium","hard"].includes(it.difficulty) ? it.difficulty : "medium",
        status: "pending",
        chat: []
      });
    }
    project.manualDraft = "";
    ui.manualAddBusy = false;
    ui.showManualAdd = false;
    ui.filter = "pending";
    persist();
    showToast(`${valid.length} question${valid.length===1?"":"s"} added to Pending.`);
    render();
  }catch(err){
    ui.manualAddBusy = false;
    showToast(aiErrorMessage(err));
    render();
  }
}

async function generateTranscriptQuestions(project){
  const textEl = document.getElementById("transcriptText");
  const text = ((textEl ? textEl.value : project.transcriptDraft) || "").trim();
  if(!text){
    ui.transcriptMsg = { ok:false, text:"Paste some transcript text first." };
    render();
    return;
  }
  project.transcriptDraft = text;
  clearTimeout(draftSaveTimer);
  persist();

  const count = ui.transcriptCount || 20;
  ui.transcriptBusy = true; ui.transcriptMsg = null; render();

  const existingAnswers = [...new Set(project.questions.filter(q=>!isEp(q)).map(q => (q.answer||"").trim().toLowerCase()).filter(Boolean))];
  const existingAnswersBlock = existingAnswers.length
    ? `\n\nAnswers already used in this project (from earlier transcripts/batches) — do NOT reuse any of these as the correct answer for a new question, even if this transcript supports them again. Find a different fact or angle instead, or skip it if there's no other angle:\n${existingAnswers.map(a=>`- ${a}`).join("\n")}`
    : "";

  const system = `You extract trivia questions from a raw transcript, script, or article about the show/movie/series "${project.name}".

${QUESTION_QUALITY_RULES}

Extract AT MOST ${count} questions from the text below — return fewer if the text doesn't clearly support that many good ones. Every question needs exactly 4 options (the correct answer plus 3 wrong answers you invent) and a difficulty (easy/medium/hard). Every question's correct answer must also be different from every other question's correct answer in this batch — never ask two questions with the same answer.

Distractor rules for the 3 wrong options:
- Match the style, language/culture of origin, gender, and setting of the correct answer (e.g. other plausible Chinese names if the answer is a Chinese character's name; other male characters if the answer is male; plausible fantasy names in a fantasy setting).
- They should be believable enough to require real knowledge of "${project.name}" to rule out — not obviously wrong.
- May mix real other characters/entities from the source with convincing invented ones.

Transcript:
"""
${text}
"""${existingAnswersBlock}${styleNotesBlock()}`;

  try{
    const client = getClient();
    const response = await client.messages.create({
      model: "claude-sonnet-5",
      max_tokens: 8192,
      thinking: { type: "disabled" },
      system,
      messages: [{ role:"user", content: "Extract the trivia questions now." }],
      output_config: { format: { type:"json_schema", schema: MANUAL_ADD_SCHEMA } }
    });
    const textBlock = response.content.find(b=>b.type==="text");
    if(!textBlock) throw new Error("No response from model.");
    const parsed = JSON.parse(textBlock.text);
    const items = Array.isArray(parsed.questions) ? parsed.questions : [];
    const MAX_ANSWER_WORDS = 3;
    const MAX_QUESTION_CHARS = 200;
    const wordCount = s => String(s).trim().split(/\s+/).filter(Boolean).length;
    const existingAnswerSet = new Set(existingAnswers);
    const seenInBatch = new Set();
    const valid = items
      .filter(it => it && typeof it.question==="string" && Array.isArray(it.options) && it.options.length>=2 && typeof it.answer==="string")
      .filter(it => it.question.length <= MAX_QUESTION_CHARS)
      .filter(it => wordCount(it.answer) <= MAX_ANSWER_WORDS)
      .filter(it => it.options.every(o => typeof o==="string" && wordCount(o) <= MAX_ANSWER_WORDS))
      .filter(it => {
        const key = it.answer.trim().toLowerCase();
        if(!key || existingAnswerSet.has(key) || seenInBatch.has(key)) return false;
        seenInBatch.add(key);
        return true;
      })
      .slice(0, count);

    if(!valid.length){
      ui.transcriptBusy = false;
      ui.transcriptMsg = { ok:false, text:"Couldn't find any solid trivia questions in that text." };
      render();
      return;
    }

    pushUndo(project);
    for(const it of valid){
      project.questions.push({
        id: uid(),
        question: it.question,
        options: it.options.slice(0,4),
        answer: it.answer,
        difficulty: ["easy","medium","hard"].includes(it.difficulty) ? it.difficulty : "medium",
        status: "pending",
        chat: []
      });
    }
    project.transcriptDraft = "";
    ui.transcriptBusy = false;
    ui.filter = "pending";
    persist();
    ui.transcriptMsg = { ok:true, text:`${valid.length} question${valid.length===1?"":"s"} added to Pending. Paste another transcript, or head to Review when you're done.` };
    showToast(`${valid.length} question${valid.length===1?"":"s"} added to Pending.`);
    render();
  }catch(err){
    ui.transcriptBusy = false;
    ui.transcriptMsg = { ok:false, text: aiErrorMessage(err) };
    render();
  }
}

async function generateEpisodeQuestions(project){
  const textEl = document.getElementById("transcriptText");
  const text = ((textEl ? textEl.value : project.transcriptDraft) || "").trim();
  const epEl = document.getElementById("episodeNumberInput");
  const ep = parseInt((epEl ? epEl.value : ui.episodeNumberDraft) || "", 10);
  if(!Number.isInteger(ep) || ep < 1){
    ui.transcriptMsg = { ok:false, text:"Type which episode this transcript is (1, 2, 3…)." };
    render(); return;
  }
  if(!text){
    ui.transcriptMsg = { ok:false, text:"Paste the episode transcript first." };
    render(); return;
  }
  const existing = scopeQuestions(project, ep);
  if(existing.length && !confirm(`Episode ${ep} already has ${existing.length} question(s). Generate more and add them to the END of episode ${ep}?`)) return;

  project.transcriptDraft = text;
  project.episodeTranscripts = project.episodeTranscripts || {};
  project.episodeTranscripts[ep] = text; // kept for Add-after, Chat and Rephrase
  clearTimeout(draftSaveTimer);
  persist();

  ui.transcriptBusy = true; ui.transcriptMsg = null; render();

  const existingBlock = existing.length
    ? `\n\nEpisode ${ep} ALREADY has these questions (in order). Write only NEW questions that come after them in the story or cover moments they missed, without repeating their answers or spoiling them:\n${existing.map((q,i)=>epQuestionBlock(q, `#${i+1}`)).join("\n")}`
    : "";
  const system = `You write Episode Mode trivia for "${project.name}", episode ${ep}: a set of multiple-choice questions that walk the player through this one episode in order, from the first scene to the last.

${EPISODE_RULES}

Aim for 20–30 questions. If the episode doesn't support that many good ones, return fewer — quality beats count.

Before you answer, re-read your list from first to last as a player would and fix anything out of order, any context that gives away its own answer, and any explanation or question that spoils a later question.

Example of one good question:
  Context: "At Central Perk: Monica downplays a dinner with a coworker while the gang probes."
  Question: "How does Monica define her 'not a date' with the guy from work?"
  Answer: "Two people going out to dinner and not having sex"
  Explanation: "Monica insists it's just dinner and 'not having sex,' downplaying it as not a real date."

Episode transcript:
\"\"\"
${text}
\"\"\"${existingBlock}${styleNotesBlock()}`;

  try{
    const parsed = await callEpisodeModel(system, `Write the Episode ${ep} questions now.`, EPISODE_BATCH_SCHEMA);
    const items = (Array.isArray(parsed.questions) ? parsed.questions : [])
      .filter(it => it && typeof it.question==="string" && Array.isArray(it.options) && it.options.length>=2 && typeof it.answer==="string");
    if(!items.length){
      ui.transcriptBusy = false;
      ui.transcriptMsg = { ok:false, text:"Couldn't find any solid questions in that transcript." };
      render(); return;
    }
    pushUndo(project);
    for(const it of items){
      project.questions.push({
        id: uid(),
        episode: ep,
        context: stripEpisodeMarker(it.context),
        question: it.question,
        options: it.options.slice(0,4),
        answer: it.answer,
        difficulty: ["easy","medium","hard"].includes(it.difficulty) ? it.difficulty : "medium",
        description: it.description || "",
        status: "pending",
        chat: []
      });
    }
    project.transcriptDraft = "";
    ui.transcriptBusy = false;
    ui.episodeNumberDraft = "";
    persist();
    // Straight to reviewing this episode, in play order.
    ui.view = "review"; ui.reviewEpisode = ep; ui.filter = "all"; ui.searchQuery = "";
    showToast(`${items.length} question${items.length===1?"":"s"} added to Episode ${ep}.`);
  }catch(err){
    ui.transcriptBusy = false;
    ui.transcriptMsg = { ok:false, text: aiErrorMessage(err) };
    render();
  }
}

/* "➕ Add after" — the user describes a moment the AI missed; write one
   question for it from the transcript and slot it in right after q. */
async function addQuestionAfter(project, q, instruction){
  if(!instruction.trim()) return;
  const transcript = episodeTranscript(project, q.episode);
  const list = scopeQuestions(project, q.episode);
  const i = list.indexOf(q);
  const before = list.slice(Math.max(0, i - 4), i + 1);
  const after = list.slice(i + 1, i + 5);
  const system = `You write ONE new Episode Mode trivia question for "${project.name}", episode ${q.episode}. It will be inserted into the episode's question list right after question #${i + 1}.

${EPISODE_RULES}

The user's request below says what the new question should be about. It OVERRIDES every rule above and every learned style preference — if they ask for something a rule would normally forbid, do what they ask. Find the moment they mean in the transcript and base the question on it.

Questions just BEFORE the new one (already seen by the player):
${before.map((o,k)=>epQuestionBlock(o, `#${i - before.length + k + 2}`)).join("\n")}
${after.length ? `\nQuestions right AFTER the new one (NOT yet seen — the new question must not give their answers away, and must not repeat their answers):\n${after.map((o,k)=>epQuestionBlock(o, `#${i + k + 2}`)).join("\n")}` : "\n(No questions come after it yet.)"}
${transcript ? `\nEpisode transcript:\n\"\"\"\n${transcript}\n\"\"\"` : "\n(No transcript was saved for this episode — rely on your own knowledge of the episode.)"}${styleNotesBlock()}`;

  ui.addAfterBusy = true; render();
  try{
    const client = getClient();
    const response = await client.messages.create({
      model: "claude-sonnet-5",
      max_tokens: 2048,
      thinking: { type: "disabled" },
      system,
      messages: [{ role:"user", content: instruction }],
      output_config: { format: { type:"json_schema", schema: EPISODE_ITEM_SCHEMA } }
    });
    const textBlock = response.content.find(b=>b.type==="text");
    if(!textBlock) throw new Error("No response from model.");
    const it = JSON.parse(textBlock.text);
    pushUndo(project);
    const newQ = {
      id: uid(),
      episode: q.episode,
      context: stripEpisodeMarker(it.context),
      question: it.question,
      options: (it.options || []).slice(0,4),
      answer: it.answer,
      difficulty: ["easy","medium","hard"].includes(it.difficulty) ? it.difficulty : "medium",
      description: it.description || "",
      status: "pending",
      chat: [{ role:"user", text:`Added after #${i + 1}: ${instruction}` }]
    };
    project.questions.splice(project.questions.indexOf(q) + 1, 0, newQ);
    persist();
    ui.addAfterId = null; ui.addAfterDraft = "";
    showToast("New question added.");
  }catch(err){
    showToast(aiErrorMessage(err));
  }finally{
    ui.addAfterBusy = false; render();
  }
}

// Move q one place earlier/later within its episode (swaps with the neighbour).
function moveQuestion(project, id, dir){
  const q = project.questions.find(x=>x.id===id);
  if(!q || !isEp(q)) return;
  const list = scopeQuestions(project, q.episode);
  const other = list[list.indexOf(q) + dir];
  if(!other) return;
  pushUndo(project);
  const a = project.questions.indexOf(q), b = project.questions.indexOf(other);
  [project.questions[a], project.questions[b]] = [project.questions[b], project.questions[a]];
  persist(); render();
}

function saveSettings(){
  const key = document.getElementById("apiKeyInput")?.value.trim() || "";
  state.apiKey = key;
  persist();
  const flash = document.getElementById("saveFlash");
  if(flash){ flash.classList.add("show"); setTimeout(()=>flash.classList.remove("show"), 1500); }
}

function doUpload(project){
  const textEl = document.getElementById("importText");
  const text = textEl?.value || "";
  const result = importQuestions(project, text);
  const msgEl = document.getElementById("importMsg");
  if(msgEl){
    msgEl.innerHTML = `<div class="import-msg ${result.ok?"ok":"err"}">${esc(result.message)}</div>`;
  }
  if(result.ok && textEl) textEl.value = "";
}

function doSaveEdit(project, id){
  const question = document.getElementById(`edit-q-${id}`).value.trim();
  const options = [0,1,2,3].map(i => document.getElementById(`edit-opt-${id}-${i}`)?.value.trim()).filter(Boolean);
  const answerIdx = document.querySelector(`input[name="edit-answer-${id}"]:checked`)?.value;
  const difficulty = document.getElementById(`edit-diff-${id}`).value;
  if(!question || options.length < 2 || answerIdx === undefined){
    showToast("Question needs text, at least 2 options, and a selected correct answer.");
    return;
  }
  const answer = options[Number(answerIdx)];
  const fields = { question, options, answer, difficulty };
  const q = project.questions.find(x=>x.id===id);
  if(q && isEp(q)){
    fields.context = stripEpisodeMarker(document.getElementById(`edit-ctx-${id}`)?.value.trim() || "");
    fields.description = document.getElementById(`edit-desc-${id}`)?.value.trim() || "";
  }
  saveEdit(project, id, fields);
  afterListAction();
}

function triggerSendChat(){
  const project = getProject(ui.projectId);
  const q = project.questions.find(x=>x.id===ui.chatQuestionId);
  const input = document.getElementById("chatInput");
  const text = input ? input.value : ui.chatDraft;
  if(!text || !text.trim()) return;
  sendChatMessage(project, q, text);
}

async function doCopyExport(project){
  const json = (projectEpisodes(project).length && ui.exportTab === "episodes")
    ? buildEpisodeExport(project, selectedExportEpisodes(project)).text
    : buildExportJson(project);
  try{
    await navigator.clipboard.writeText(json);
    showToast("Copied to clipboard.");
  }catch(e){
    showToast("Couldn't access clipboard — select and copy manually.");
  }
}

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
render();
</script>
