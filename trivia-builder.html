<!doctype html>
<html lang="en">
<head>
<script>if(/TriviaGauntletPremium/.test(navigator.userAgent||''))document.documentElement.classList.add('premium-app');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia Builder (Local)</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg:#0f1115; --bg-alt:#161923; --panel:#1b1f2b; --panel-alt:#22273a;
    --border:#2c3244; --border-light:#3a4160;
    --text:#e8eaf2; --text-dim:#9aa1b8; --text-faint:#6b7291;
    --accent:#7c9cff; --accent-dim:#3d4c8a;
    --green:#4ade80; --green-dim:#1e4030;
    --red:#f87171; --red-dim:#3a1f22;
    --yellow:#fbbf24; --orange:#fb923c;
    --easy:#4ade80; --medium:#fbbf24; --hard:#f87171;
    --radius:10px; --radius-sm:6px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-dim);}

  /* ---------- Layout shells ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:12px 20px; background:rgba(15,17,21,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand{font-weight:700; font-size:15px; letter-spacing:.02em; color:var(--text);}
  .topbar .brand span{color:var(--accent);}
  .topbar nav{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap;}
  .container{max-width:1100px; margin:0 auto; padding:24px 20px 80px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--panel-alt); color:var(--text); font-size:13.5px; font-weight:500;
    transition:background .12s, border-color .12s, transform .06s;
    white-space:nowrap;
  }
  .btn:hover{background:#2a3049; border-color:var(--accent-dim);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#10131c; font-weight:700;}
  .btn-primary:hover{background:#93aeff;}
  .btn-danger{border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:var(--red-dim);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--panel-alt);}
  .btn-sm{padding:5px 10px; font-size:12.5px;}
  .btn.active{background:var(--accent); border-color:var(--accent); color:#10131c; font-weight:700;}

  /* ---------- Home ---------- */
  .home-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .home-head h1{font-size:22px; margin:0;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
  .settings-panel{margin-bottom:26px;}
  .settings-panel h2{font-size:14px; margin:0 0 12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
  .settings-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .settings-row input[type=password], .settings-row input[type=text], .settings-row select{
    flex:1 1 260px; min-width:180px; padding:9px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); font-size:13.5px;
  }
  .settings-row select{flex:0 0 220px;}
  .settings-hint{font-size:12px; color:var(--text-faint); margin-top:8px; line-height:1.5;}
  .save-flash{color:var(--green); font-size:12.5px; margin-left:4px; opacity:0; transition:opacity .2s;}
  .save-flash.show{opacity:1;}

  .project-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .project-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; text-align:left; display:flex; flex-direction:column; gap:10px;
    transition:border-color .12s, transform .06s;
  }
  .project-card:hover{border-color:var(--accent-dim); transform:translateY(-1px);}
  .project-card .pname{font-weight:700; font-size:15.5px;}
  .project-card .pstats{display:flex; gap:14px; font-size:12.5px; color:var(--text-dim);}
  .project-card .pstats b{color:var(--text);}
  .project-card-main{
    background:none; border:none; padding:0; margin:0; color:inherit; text-align:left;
    display:flex; flex-direction:column; gap:10px; cursor:pointer; width:100%;
  }
  .project-card-actions{display:flex; justify-content:flex-end;}
  .empty-state{color:var(--text-faint); font-size:13.5px; padding:40px 0; text-align:center;}

  /* ---------- Import page ---------- */
  .import-wrap{display:flex; flex-direction:column; gap:14px;}
  textarea.json-input{
    width:100%; min-height:320px; padding:14px; border-radius:var(--radius);
    border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:1.5; resize:vertical;
  }
  .import-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .import-msg{font-size:13.5px; padding:8px 0;}
  .import-msg.ok{color:var(--green);}
  .import-msg.err{color:var(--red);}

  /* ---------- Search ---------- */
  .search-row{display:flex; gap:8px; align-items:center; padding-top:14px;}
  .search-input{
    flex:1; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--bg-alt); color:var(--text); font-size:13.5px;
  }

  /* ---------- Review toolbar ---------- */
  .review-toolbar{
    position:sticky; top:53px; z-index:15; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--bg); padding:10px 0 14px; border-bottom:1px solid var(--border); margin-bottom:16px;
  }
  .filter-group{display:flex; gap:6px; flex-wrap:wrap;}
  .toolbar-spacer{flex:1;}
  .count-pill{font-size:12px; color:var(--text-faint); padding:4px 2px;}
  .btn-dupe{border-color:var(--border-light);}
  .btn-dupe.has-dupes{border-color:var(--orange); color:var(--orange);}
  .btn-dupe.has-dupes:hover{background:var(--red-dim);}
  .btn-dupe.active{background:var(--orange); border-color:var(--orange); color:#10131c;}
  .select-checkbox{width:16px; height:16px; accent-color:var(--accent); margin-right:6px; vertical-align:-3px;}
  .bulk-toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--panel-alt); border:1px solid var(--border-light); border-radius:var(--radius-sm);
    padding:8px 12px; margin:-4px 0 14px;
  }
  .bulk-toolbar select{
    padding:6px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--bg-alt); color:var(--text); font-size:12.5px;
  }

  /* ---------- Question cards ---------- */
  .qlist{display:flex; flex-direction:column; gap:12px;}
  .qcard{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .qcard.approved{border-color:var(--green-dim);}
  .qcard-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .qnum{font-size:12px; color:var(--text-faint); font-weight:700;}
  .qtext{font-size:15.5px; font-weight:600; line-height:1.4; margin:2px 0 10px;}
  .dup-note{
    display:flex; align-items:flex-start; gap:6px; margin:-2px 0 10px; padding:8px 10px;
    border-radius:var(--radius-sm); background:var(--red-dim); color:#ffb4b4; font-size:12.5px; line-height:1.45;
  }
  .badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
  .badge.status-pending{background:#3a3320; color:var(--yellow);}
  .badge.status-approved{background:var(--green-dim); color:var(--green);}
  .badge.diff-easy{background:#173321; color:var(--easy);}
  .badge.diff-medium{background:#3a3320; color:var(--medium);}
  .badge.diff-hard{background:#3a1f22; color:var(--hard);}
  select.diff-select{
    background:var(--bg-alt); color:var(--text); border:1px solid var(--border-light);
    border-radius:20px; font-size:11px; font-weight:700; padding:3px 8px; text-transform:uppercase;
  }

  .options-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;}
  .opt{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
    background:var(--bg-alt); border:1px solid var(--border); font-size:13.5px;
  }
  .opt .check{color:var(--text); font-weight:900;}

  .qactions{display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:12px;}

  /* ---------- Edit mode ---------- */
  .edit-block{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .edit-block textarea, .edit-block input[type=text]{
    width:100%; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--bg-alt); color:var(--text); font-size:13.5px;
  }
  .edit-opt-row{display:flex; align-items:center; gap:8px;}
  .edit-opt-row input[type=radio]{accent-color:var(--accent); width:16px; height:16px; flex:0 0 auto;}
  .edit-meta-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .edit-meta-row select{padding:7px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); font-size:13px;}

  /* ---------- Modal / overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,7,10,.72); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    width:100%; max-width:640px; max-height:85vh; display:flex; flex-direction:column;
    box-shadow:var(--shadow);
  }
  .modal.wide{max-width:820px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0; font-size:15.5px;}
  .modal-body{padding:18px 20px; overflow-y:auto; flex:1;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end;}

  /* chat */
  .chat-log{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .chat-msg{padding:10px 13px; border-radius:var(--radius-sm); font-size:13.5px; line-height:1.5; max-width:88%;}
  .chat-msg.user{background:var(--accent-dim); align-self:flex-end; color:#dfe6ff;}
  .chat-msg.ai{background:var(--panel-alt); align-self:flex-start; border:1px solid var(--border);}
  .chat-msg.error{background:var(--red-dim); color:var(--red); align-self:stretch;}
  .chat-input-row{display:flex; gap:8px;}
  .chat-input-row textarea{flex:1; min-height:52px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-light); background:var(--bg-alt); color:var(--text); resize:vertical; font-size:13.5px;}
  .ep-context{font-size:12.5px; color:var(--text-dim); font-style:italic; margin:2px 0 6px;}
  .ep-desc{font-size:12.5px; color:var(--text-dim); margin-top:8px; padding:8px 10px; background:var(--bg-alt); border-radius:var(--radius-sm);}
  .ep-label{display:block; font-size:12px; color:var(--text-faint); margin:6px 0 2px;}
  .chat-context{font-size:12px; color:var(--text-faint); background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:14px;}
  .chat-panel{margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
  .spinner{display:inline-block; width:13px; height:13px; border:2px solid var(--text-faint); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .export-json{width:100%; min-height:340px; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border-light);
    background:var(--bg-alt); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;}

  .trash-list{display:flex; flex-direction:column; gap:8px;}
  .trash-item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius-sm);}
  .trash-item .ttext{font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-alt); border:1px solid var(--border-light);
    padding:10px 18px; border-radius:30px; font-size:13px; z-index:200; box-shadow:var(--shadow);}

  @media (max-width:640px){
    .options-grid{grid-template-columns:1fr;}
    .settings-row select{flex:1 1 100%;}
    .review-toolbar{top:49px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* =========================================================================
   TRIVIA BUILDER — single-file local app
   Persistence: localStorage only. AI calls: Anthropic Messages API via the
   official SDK, loaded from a CDN and run in-browser (dangerouslyAllowBrowser).
   ========================================================================= */
import Anthropic from "https://esm.sh/@anthropic-ai/sdk";

/* ---------------------------------------------------------------------
   Storage
--------------------------------------------------------------------- */
const STORAGE_KEY = "triviaBuilderState_v1";
const UI_STORAGE_KEY = "triviaBuilderUI_v1";

function loadUiState(){
  try{
    const raw = localStorage.getItem(UI_STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("Failed to parse saved UI state.", e); }
  return null;
}
function saveUiState(){
  localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({
    view: ui.view, projectId: ui.projectId, filter: ui.filter, editingId: ui.editingId,
    reviewEpisode: ui.reviewEpisode, transcriptMode: ui.transcriptMode
  }));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.styleNotes)) parsed.styleNotes = [];
      if(!parsed.episodeModel) parsed.episodeModel = "sonnet";
      return parsed;
    }
  }catch(e){ console.warn("Failed to parse saved state, starting fresh.", e); }
  return { apiKey:"", projects:{}, styleNotes:[], episodeModel:"sonnet" };
}
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let draftSaveTimer = null;
function scheduleDraftSave(){
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(persist, 400);
}
function flushDraftSave(){
  clearTimeout(draftSaveTimer);
  persist();
}

const state = loadState();

// Restore last screen (view/project/filter/editing) so navigating away and back doesn't dump you on the homepage.
const savedUi = loadUiState();
const restoredProjectId = savedUi && savedUi.projectId && state.projects[savedUi.projectId] ? savedUi.projectId : null;

const ui = {
  view: restoredProjectId ? (savedUi.view || "review") : "home",
  projectId: restoredProjectId,
  filter: (savedUi && savedUi.filter) || "pending",        // pending | approved | easy | medium | hard
  editingId: restoredProjectId ? (savedUi.editingId || null) : null,          // question id currently in edit mode
  chatQuestionId: null,     // question id whose AI Chat panel is open — not persisted
  chatDraft: "",
  chatBusy: false,
  optionsBusyId: null,      // question id currently running "AI Options"
  rephraseBusyId: null,     // question id currently running "Rephrase"
  showTrash: false,
  showExport: false,
  showStorage: false,
  showManualAdd: false,
  showArchived: false,
  showStyleNotes: false,
  manualAddBusy: false,
  transcriptCount: 20,   // 10 | 20 | 50 — not persisted
  transcriptBusy: false,
  transcriptMsg: null,   // { ok, text } — not persisted
  searchQuery: "",
  newProjectOpen: false,
  toast: null,
  selectMode: false,        // bulk-select mode in Review — not persisted
  selectedIds: new Set(),   // ids currently selected in bulk-select mode
  // Episode Mode
  transcriptMode: (savedUi && savedUi.transcriptMode) || "regular", // regular | episode
  episodeNumberDraft: "",   // Episode # box on the transcript screen — not persisted
  reviewEpisode: restoredProjectId && savedUi && typeof savedUi.reviewEpisode === "number" ? savedUi.reviewEpisode : null, // null = regular questions
  addAfterId: null,         // question id whose "Add after" panel is open
  addAfterDraft: "",
  addAfterBusy: false,
  exportTab: "regular",     // regular | episodes
  exportEpisodes: null,     // Set of episode numbers ticked in the export modal (null = all)
};

// Per-project undo/redo history — kept in memory only (last ~10 actions).
const historyMap = {}; // { [projectId]: { undo:[snapshot,...], redo:[snapshot,...] } }
function getHistory(pid){
  if(!historyMap[pid]) historyMap[pid] = { undo:[], redo:[] };
  return historyMap[pid];
}
function snapshot(project){
  return { questions: structuredClone(project.questions), trash: structuredClone(project.trash) };
}
function pushUndo(project){
  const h = getHistory(project.id);
  h.undo.push(snapshot(project));
  if(h.undo.length > 10) h.undo.shift();
  h.redo.length = 0; // any new action invalidates redo history
}
function undo(project){
  const h = getHistory(project.id);
  if(!h.undo.length) return;
  h.redo.push(snapshot(project));
  const prev = h.undo.pop();
  project.questions = prev.questions;
  project.trash = prev.trash;
  persist();
}
function redo(project){
  const h = getHistory(project.id);
  if(!h.redo.length) return;
  h.undo.push(snapshot(project));
  const next = h.redo.pop();
  project.questions = next.questions;
  project.trash = next.trash;
  persist();
}

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function uid(){ return crypto.randomUUID(); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function getProject(id){ return state.projects[id]; }
function showToast(msg){
  ui.toast = msg;
  render();
  setTimeout(()=>{ ui.toast = null; render(); }, 2600);
}

/* ---------------------------------------------------------------------
   AI layer
--------------------------------------------------------------------- */
// Every AI action (chat / options / rephrase) returns JSON matching this
// shape via structured outputs, so we never depend on free-form parsing.
const UPDATE_SCHEMA = {
  type: "object",
  properties: {
    explanation: { type: "string", description: "Brief explanation of what changed and why. Always include this." },
    question: { type: "string", description: "New question text, only if it changed." },
    options: { type: "array", items: { type: "string" }, description: "The full new set of 4 options, only if any changed." },
    answer: { type: "string", description: "The correct answer, only if it changed. Must exactly match one of the returned/kept options." },
    difficulty: { type: "string", enum: ["easy","medium","hard"], description: "Only if it changed." },
    context: { type: "string", description: "Episode Mode only: new scene-setting context line, only if it changed." },
    description: { type: "string", description: "Episode Mode only: new explanation shown after answering, only if it changed." },
    learnedRule: { type: "string", description: "Only set this if the user's message expresses a durable, general preference or correction that should apply to ALL future questions across ALL projects — not a one-off edit specific to this single question. State it as a short, standalone imperative rule (e.g. \"Prefer obscure/deep-cut distractors over obvious ones\"). Leave empty/omit for one-off edits." }
  },
  required: ["explanation"],
  additionalProperties: false
};

// Global, cross-project style rules the AI infers from user corrections during chat.
function styleNotesBlock(){
  if(!state.styleNotes || !state.styleNotes.length) return "";
  return `\n\nLearned style preferences (inferred from your past corrections — apply to every question unless they conflict with the rules above):\n${state.styleNotes.map(r=>`- ${r}`).join("\n")}`;
}
function addLearnedRule(rule){
  const clean = rule.trim();
  if(!clean) return;
  state.styleNotes = state.styleNotes || [];
  if(state.styleNotes.some(r => r.toLowerCase() === clean.toLowerCase())) return;
  state.styleNotes.push(clean);
  if(state.styleNotes.length > 40) state.styleNotes.shift();
  persist();
}

/* ---------------------------------------------------------------------
   Episode Mode helpers
   Episode questions live in project.questions like any other, tagged with
   q.episode (a number) and carrying q.context + q.description. Their ORDER in
   project.questions is the order they're played in on the site.
--------------------------------------------------------------------- */
function isEp(q){ return typeof q.episode === "number"; }
function projectEpisodes(project){
  return [...new Set(project.questions.filter(isEp).map(q=>q.episode))].sort((a,b)=>a-b);
}
// Questions in the review scope: one episode, or (null) the regular non-episode questions.
function scopeQuestions(project, ep = ui.reviewEpisode){
  return project.questions.filter(q => ep === null ? !isEp(q) : q.episode === ep);
}
function episodeTranscript(project, ep){
  return (project.episodeTranscripts && project.episodeTranscripts[ep]) || "";
}
// The site splits a show's file into episodes wherever a context contains
// "episode <number>" (assets/episode.js) — so only the first question of each
// episode may say it; anywhere else it would start a bogus new episode.
const EP_MARKER_RE = /episode\s+\d+/i;
function stripEpisodeMarker(context){
  return String(context || "").replace(/^\s*'?\*\*EPISODE\s+\d+\*\*:?\s*/i, "");
}
function epQuestionBlock(q, label){
  return `${label}\n  Context: ${q.context || "(none)"}\n  Question: ${q.question}\n  Options: ${q.options.join(" | ")}\n  Answer: ${q.answer}\n  Explanation: ${q.description || "(none)"}`;
}
// The questions right before/after q in its episode, so edits stay spoiler-free.
function episodeNeighboursBlock(project, q, n = 3){
  const list = scopeQuestions(project, q.episode);
  const i = list.indexOf(q);
  const before = list.slice(Math.max(0, i - n), i);
  const after = list.slice(i + 1, i + 1 + n);
  const parts = [];
  if(before.length) parts.push(`Questions that come BEFORE this one (the player has already seen these):\n${before.map((o,k)=>epQuestionBlock(o, `#${i - before.length + k + 1}`)).join("\n")}`);
  if(after.length) parts.push(`Questions that come AFTER this one (the player has NOT seen these yet — nothing in this question may give their answers away):\n${after.map((o,k)=>epQuestionBlock(o, `#${i + k + 2}`)).join("\n")}`);
  return parts.join("\n\n");
}

const EPISODE_RULES = `Episode Mode rules — the questions are played in order and retell the episode's story as the player goes:
- ORDER: questions follow the episode chronologically, from the opening scene to the final scene.
- WHAT TO ASK: meaningful, recognisable things from the episode — names, places, events, relationships, objects, key decisions and reveals. Not insignificant actions or throwaway details. Only things a viewer actually saw or heard; a transcript's speaker labels, stage directions and "[laughs]"-style notes never reach the audience, so never base a question on them.
- CONTEXT: one short sentence setting the scene so the player knows which moment the question is about (e.g. "At Central Perk, Monica downplays a dinner with a coworker while the gang probes."). It must NOT reveal or hint at the answer. Never write the word "episode" followed by a number in a context.
- QUESTION: one clear, concise sentence.
- ANSWER: prefer a short answer (a name, place, object, number, title). A longer phrase is fine when that is genuinely the natural answer (e.g. "Two people going out to dinner and not having sex"). Avoid emotions, opinions and vague adjectives as answers.
- WRONG OPTIONS: 3 believable wrong options matching the correct answer's style, length and setting, so the player needs to have watched to rule them out.
- EXPLANATION: 1–2 sentences explaining the answer, shown after the player answers. It may refer to what has already happened, but must NOT reveal anything asked in a later question.
- NO SPOILERS FORWARD: no context, question, answer or explanation may give away the answer to a later question in the episode.
- No two questions in the same episode may have the same correct answer.
- Never pad: only write questions the episode clearly supports.`;

const EPISODE_ITEM_SCHEMA = {
  type: "object",
  properties: {
    context: { type: "string", description: "One short scene-setting sentence that does not reveal the answer." },
    question: { type: "string" },
    options: { type: "array", items: { type: "string" }, description: "Exactly 4 options, including the correct one." },
    answer: { type: "string", description: "Must exactly match one of the 4 options." },
    difficulty: { type: "string", enum: ["easy","medium","hard"] },
    description: { type: "string", description: "1-2 sentence explanation shown after answering; no spoilers for later questions." }
  },
  required: ["context","question","options","answer","difficulty","description"],
  additionalProperties: false
};
const EPISODE_BATCH_SCHEMA = {
  type: "object",
  properties: { questions: { type: "array", items: EPISODE_ITEM_SCHEMA } },
  required: ["questions"],
  additionalProperties: false
};

// Main episode generation is the one call worth a stronger setting: keeping
// 20-30 questions in order and spoiler-free needs the model to think across the
// whole episode. Toggle (Episode Mode only) lives on the transcript screen.
const EPISODE_MODELS = {
  sonnet: { label: "Sonnet 5 + reasoning", note: "default, cheaper" },
  opus:   { label: "Opus 5 + reasoning", note: "stronger, costs more" },
};
async function callEpisodeModel(system, userText, schema){
  const client = getClient();
  const base = {
    max_tokens: 32000,
    thinking: { type: "adaptive" },
    system,
    messages: [{ role:"user", content: userText }],
  };
  // Streamed + finalMessage(): a long, reasoning-on generation can outlast a
  // plain request's HTTP timeout.
  const response = state.episodeModel === "opus"
    ? await client.beta.messages.stream({
        ...base,
        model: "claude-opus-5",
        output_config: { effort: "high", format: { type:"json_schema", schema } },
        // If Opus declines a request, the API re-runs it on Anthropic's recommended backup model.
        betas: ["server-side-fallback-2026-07-01"],
        fallbacks: "default",
      }).finalMessage()
    : await client.messages.stream({
        ...base,
        model: "claude-sonnet-5",
        output_config: { format: { type:"json_schema", schema } },
      }).finalMessage();
  if(response.stop_reason === "refusal") throw new Error("The model declined this request.");
  if(response.stop_reason === "max_tokens") throw new Error("The response ran out of room before finishing — try a shorter transcript.");
  const textBlock = response.content.find(b => b.type === "text");
  if(!textBlock) throw new Error("No response from model.");
  return JSON.parse(textBlock.text);
}

// Manual-add: turn rough freeform notes into a batch of full question objects.
const MANUAL_ADD_SCHEMA = {
  type: "object",
  properties: {
    questions: {
      type: "array",
      items: {
        type: "object",
        properties: {
          question: { type: "string" },
          options: { type: "array", items: { type: "string" }, description: "Exactly 4 answer options, including the correct one." },
          answer: { type: "string", description: "Must exactly match one of the 4 options." },
          difficulty: { type: "string", enum: ["easy","medium","hard"] }
        },
        required: ["question","options","answer","difficulty"],
        additionalProperties: false
      }
    }
  },
  required: ["questions"],
  additionalProperties: false
};

// Baseline quality bar for anything that MINTS new questions from raw source
// material (transcript generation) rather than editing something the user
// already wrote — this is where an AI is most tempted to invent filler.
const QUESTION_QUALITY_RULES = `Trivia question quality rules — every question you produce must follow ALL of these:
- HARD LIMIT: the correct answer must be 3 WORDS OR FEWER — a person's name, a place, a specific object/item/title, a rank or role, a number or date, or similar. Count the words before you finalize each answer. If it's 4+ words, cut it down to the shortest form that still identifies the fact (e.g. "the Chrysler Building" not "the tall silver building on the corner of Lexington") — and if it truly can't be shortened, skip the question.
- NEVER write a question whose correct answer would have to be a full sentence, a quote, a description of what someone said/thought/felt, an adjective, an emotion, or an opinion. If the only accurate answer to something interesting in the text would be phrased that way, skip it rather than forcing it.
- The 3 wrong options must also be 3 words or fewer each, matching the length and style of the correct answer.
- Keep the question itself concise — one clear sentence. Do not embed long quotes, multi-sentence scene descriptions, or run-on setups into the question text.
- Only ask about things a viewer/player who actually watched or read the finished work would know. A raw transcript/script often contains artifacts that never reach the audience — speaker-label names, stage/camera directions, scene-setting descriptions, writer's notes, "[laughs]"-style annotations. Never base a question on one of those; only use them to figure out what a viewer would have seen or heard on screen, and ask about that instead.
- Do not invent filler questions just to hit a target count. Only write questions the source material clearly and directly supports. Returning fewer questions than the max is correct and expected if the material runs out of good material — never pad with guesses, trivial restatements, or invented details.
- Each question must stand alone and make sense to someone who has seen/read the finished work, without needing the original text in front of them.
- Vary WHAT is being asked for across the batch — don't let "who is/said/did this" (a person's name) questions dominate. Mix in questions whose answer is a place, an object/item, a number or date, a title, a rank/role, or similar, whenever the source material supports it. As a rough guide, no more than about a third of the batch should have a person's name as the answer.`;

function getClient(){
  if(!state.apiKey) throw new Error("NO_KEY");
  return new Anthropic({ apiKey: state.apiKey, dangerouslyAllowBrowser: true });
}

async function askAI(systemPrompt, messages){
  const client = getClient();
  const response = await client.messages.create({
    model: "claude-sonnet-5",
    max_tokens: 1536,
    thinking: { type: "disabled" },
    system: systemPrompt,
    messages,
    output_config: { format: { type: "json_schema", schema: UPDATE_SCHEMA } }
  });
  const textBlock = response.content.find(b => b.type === "text");
  if(!textBlock) throw new Error("No text response from model.");
  return { parsed: JSON.parse(textBlock.text), rawContent: response.content };
}

function aiErrorMessage(err){
  if(err && err.message === "NO_KEY") return "Set your Claude API key on the Home page first.";
  if(err && err.status === 401) return "Invalid API key.";
  if(err && err.status === 429) return "Rate limited — wait a moment and try again.";
  if(err && err.status) return `API error (${err.status}): ${err.message || "unknown"}`;
  return `Request failed: ${err?.message || err}`;
}

function questionContextBlock(project, q){
  return [
    `Show/movie/series: ${project.name}`,
    `Question: ${q.question}`,
    `Options: ${q.options.map((o,i)=>`${i+1}. ${o}`).join(" | ")}`,
    `Correct answer: ${q.answer}`,
    `Difficulty: ${q.difficulty}`,
    ...(isEp(q) ? [`Episode: ${q.episode}`, `Context (scene setup shown above the question): ${q.context || "(none)"}`, `Explanation (shown after answering): ${q.description || "(none)"}`] : [])
  ].join("\n");
}

// Episode questions: the neighbouring questions (+ the transcript when asked),
// so an AI edit can't spoil what comes next.
function episodeAiBlock(project, q, withTranscript){
  if(!isEp(q)) return "";
  const neighbours = episodeNeighboursBlock(project, q);
  const transcript = withTranscript ? episodeTranscript(project, q.episode) : "";
  return `\n\nThis is an Episode Mode question (episode ${q.episode}).\n${EPISODE_RULES}${neighbours ? `\n\n${neighbours}` : ""}${transcript ? `\n\nEpisode transcript:\n\"\"\"\n${transcript}\n\"\"\"` : ""}`;
}

/* AI Options — regenerate believable distractors, keep question + answer fixed. */
async function runAiOptions(project, q){
  ui.optionsBusyId = q.id; render();
  const system = `You improve the WRONG answer choices (distractors) for a single trivia question from the show/movie/series "${project.name}".
Rules:
- Do NOT change the question text.
- Do NOT change the correct answer.
- Replace the 3 incorrect options with new ones that are believable and contextually appropriate.
- Match the style, language/culture of origin, gender, and setting of the correct answer. Example: if the answer is a Chinese character's name, use other believable Chinese names, not random English ones. If the answer is a male character, don't fill distractors only with female characters. If the setting is a fantasy world, use plausible fantasy names.
- Distractors may be a mix of real characters/entities from the show and convincing fictional ones, as long as they feel fair.
- Return the FULL new set of 4 options (including the unchanged correct answer, in any position) in the "options" field.
- In "explanation", state which options you removed, what you replaced them with, and why the new set is an improvement.
Context:
${questionContextBlock(project, q)}${episodeAiBlock(project, q, false)}${styleNotesBlock()}`;
  q.chat = q.chat || [];
  q.chat.push({ role:"user", text:"Generate improved distractor options." });
  ui.chatQuestionId = q.id;
  render();
  try{
    const { parsed } = await askAI(system, [{ role:"user", content:"Generate improved distractor options now." }]);
    if(!parsed.options || !parsed.options.includes(q.answer)){
      q.chat.push({ role:"error", text:"AI response didn't preserve the correct answer — no changes applied." });
      return;
    }
    pushUndo(project);
    q.options = parsed.options;
    persist();
    q.chat.push({ role:"ai", text: parsed.explanation || "Options updated." });
  }catch(err){
    q.chat.push({ role:"error", text: aiErrorMessage(err) });
  }finally{
    ui.optionsBusyId = null; render();
  }
}

/* Rephrase — natural English, meaning/answer/options untouched. */
async function runRephrase(project, q){
  ui.rephraseBusyId = q.id; render();
  const system = `You rewrite an awkwardly-phrased trivia question into natural, fluent English for the show/movie/series "${project.name}".
Rules:
- Preserve the exact meaning and factual content.
- Do NOT change the correct answer.
- Do NOT change the options.
- Only return the "question" field with the rewritten text, plus "explanation".
Context:
${questionContextBlock(project, q)}${episodeAiBlock(project, q, true)}${styleNotesBlock()}`;
  q.chat = q.chat || [];
  q.chat.push({ role:"user", text:"Rephrase this question." });
  ui.chatQuestionId = q.id;
  try{
    const { parsed } = await askAI(system, [{ role:"user", content:"Rephrase this question now." }]);
    if(!parsed.question){ q.chat.push({ role:"error", text:"AI did not return a rephrased question." }); return; }
    pushUndo(project);
    q.question = parsed.question;
    persist();
    q.chat.push({ role:"ai", text: parsed.explanation || "Question rephrased." });
  }catch(err){
    q.chat.push({ role:"error", text: aiErrorMessage(err) });
  }finally{
    ui.rephraseBusyId = null; render();
  }
}

/* AI Chat — free-form multi-turn editing of a single question. */
function chatSystemPrompt(project, q){
  return `You are helping refine ONE trivia question for the show/movie/series "${project.name}".${isEp(q) ? "" : " You are not aware of any other questions in the project — only this one."}
Current state:
${questionContextBlock(project, q)}${episodeAiBlock(project, q, true)}${styleNotesBlock()}
The user will ask for changes (rewrite the question, replace an option, change the correct answer, make it harder/easier, rewrite all options${isEp(q) ? ", rewrite the context or the explanation" : ""}, etc.). Apply the change immediately by including only the field(s) that changed in your JSON response (question / options / answer / difficulty${isEp(q) ? " / context / description" : ""}). If options are returned, return the full set of 4.

The user's instructions in this chat OVERRIDE every rule above and every learned style preference. If they ask for something a rule would normally forbid (e.g. a longer answer, a longer question), do exactly what they ask. Always fill "explanation" with a short note on what you changed. If the user is just asking a question or chatting without requesting a change, leave the edit fields out and just answer in "explanation".

Also watch for durable preferences: if this correction reveals something you should do differently on EVERY question from now on (not just this one) — a formatting habit, a tone/difficulty calibration, a rule about distractor style, a pet peeve — capture it in "learnedRule" so it's remembered for future questions and future projects. Don't set it for edits that only make sense for this specific question.`;
}

async function sendChatMessage(project, q, userText){
  if(!userText.trim()) return;
  q.chat = q.chat || [];
  q.chat.push({ role:"user", text:userText });
  ui.chatBusy = true; ui.chatDraft = ""; render();
  try{
    // Replay prior turns as plain text so the model has full context of the thread.
    const history = q.chat.slice(0,-1).map(m => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.role === "user" ? m.text : JSON.stringify({ explanation: m.text, ...(m.applied||{}) })
    }));
    const messages = [...history, { role:"user", content:userText }];
    const { parsed } = await askAI(chatSystemPrompt(project, q), messages);

    const applied = {};
    pushUndo(project);
    if(parsed.question){ q.question = parsed.question; applied.question = parsed.question; }
    if(parsed.options){ q.options = parsed.options; applied.options = parsed.options; }
    if(parsed.answer){ q.answer = parsed.answer; applied.answer = parsed.answer; }
    if(parsed.difficulty){ q.difficulty = parsed.difficulty; applied.difficulty = parsed.difficulty; }
    if(isEp(q) && parsed.context){ q.context = parsed.context; applied.context = parsed.context; }
    if(isEp(q) && parsed.description){ q.description = parsed.description; applied.description = parsed.description; }
    persist();

    if(parsed.learnedRule) addLearnedRule(parsed.learnedRule);
    q.chat.push({ role:"ai", text: parsed.explanation || "Done.", applied, learnedRule: parsed.learnedRule || null });
  }catch(err){
    q.chat.push({ role:"error", text: aiErrorMessage(err) });
    // Undo the speculative user push's paired state push isn't needed — nothing was applied.
  }finally{
    ui.chatBusy = false; persist(); render();
  }
}

/* ---------------------------------------------------------------------
   Mutating actions (question lifecycle)
--------------------------------------------------------------------- */
function approveQuestion(project, id){
  const q = project.questions.find(x=>x.id===id);
  if(!q) return;
  pushUndo(project);
  q.status = "approved";
  persist(); render();
}
function deleteQuestion(project, id){
  const idx = project.questions.findIndex(x=>x.id===id);
  if(idx===-1) return;
  pushUndo(project);
  const [q] = project.questions.splice(idx,1);
  project.trash.push(q);
  persist(); render();
}
function restoreQuestion(project, id){
  const idx = project.trash.findIndex(x=>x.id===id);
  if(idx===-1) return;
  pushUndo(project);
  const [q] = project.trash.splice(idx,1);
  project.questions.push(q);
  persist(); render();
}
function clearTrash(project){
  if(!project.trash.length) return;
  if(!confirm(`Permanently delete ${project.trash.length} question(s) in Trash? This cannot be undone.`)) return;
  pushUndo(project);
  project.trash = [];
  persist(); render();
}
function setDifficulty(project, id, difficulty){
  const q = project.questions.find(x=>x.id===id);
  if(!q) return;
  pushUndo(project);
  q.difficulty = difficulty;
  persist(); render();
}
function saveEdit(project, id, fields){
  const q = project.questions.find(x=>x.id===id);
  if(!q) return;
  pushUndo(project);
  Object.assign(q, fields, { status:"approved" });
  ui.editingId = null;
  persist(); render();
}

/* Bulk actions on the current selection (Review screen "Select" mode). */
function bulkApprove(project){
  if(!ui.selectedIds.size) return;
  pushUndo(project);
  project.questions.forEach(q=>{ if(ui.selectedIds.has(q.id)) q.status = "approved"; });
  persist(); render();
}
function bulkSetDifficulty(project, difficulty){
  if(!ui.selectedIds.size || !["easy","medium","hard"].includes(difficulty)) return;
  pushUndo(project);
  project.questions.forEach(q=>{ if(ui.selectedIds.has(q.id)) q.difficulty = difficulty; });
  persist(); render();
}
function bulkDeleteSelected(project){
  if(!ui.selectedIds.size) return;
  pushUndo(project);
  const toTrash = project.questions.filter(q=>ui.selectedIds.has(q.id));
  project.questions = project.questions.filter(q=>!ui.selectedIds.has(q.id));
  project.trash.push(...toTrash);
  ui.selectedIds = new Set();
  persist(); render();
}

/* ---------------------------------------------------------------------
   Import
--------------------------------------------------------------------- */
function importQuestions(project, rawText){
  let data;
  try{ data = JSON.parse(rawText); }
  catch(e){ return { ok:false, message:"Invalid JSON — please check the pasted text." }; }
  const arr = Array.isArray(data) ? data : (Array.isArray(data?.questions) ? data.questions : null);
  if(!arr) return { ok:false, message:"Expected a JSON array of question objects." };

  const valid = [];
  for(const item of arr){
    if(!item || typeof item.question !== "string" || !Array.isArray(item.options) || item.options.length < 2) continue;
    if(typeof item.answer !== "string") continue;
    valid.push({
      id: uid(),
      question: item.question,
      options: item.options.slice(0,4),
      answer: item.answer,
      difficulty: ["easy","medium","hard"].includes(item.difficulty) ? item.difficulty : "medium",
      status: "pending",
      chat: []
    });
  }
  if(!valid.length) return { ok:false, message:"No valid questions found in that JSON." };

  pushUndo(project);
  project.questions.push(...valid);
  persist();
  return { ok:true, message:`${valid.length} question${valid.length===1?"":"s"} uploaded.` };
}

   Export
--------------------------------------------------------------------- */
function buildExportJson(project){
  const approved = project.questions.filter(q => q.status === "approved" && !isEp(q));
  const out = approved.map((q,i) => ({
    id: i+1,
    question: q.question,
    options: q.options,
    answer: q.answer,
    difficulty: q.difficulty
  }));
  return JSON.stringify(out, null, 2);
}

// Episode export in the site's episode-file format (data/<show>eps1.txt).
// Episode 1 included -> a complete new file. Otherwise -> a block to paste
// over the final "]" of the show's existing file.
function buildEpisodeExport(project, episodes){
  const eps = [...episodes].sort((a,b)=>a-b);
  const items = [];
  for(const ep of eps){
    scopeQuestions(project, ep).filter(q=>q.status==="approved").forEach((q, i)=>{
      const ctx = stripEpisodeMarker(q.context);
      items.push({
        context: i === 0 ? `**EPISODE ${ep}**: ${ctx}` : ctx,
        question: q.question,
        options: q.options,
        answer: q.answer,
        difficulty: q.difficulty,
        episode: ep,
        description: q.description || ""
      });
    });
  }
  if(!items.length) return { text:"", fullFile:false, count:0 };
  const json = JSON.stringify(items, null, 2);
  const fullFile = eps[0] === 1;
  return { text: fullFile ? json : json.replace(/^\[\n/, ",\n"), fullFile, count: items.length };
}

--------------------------------------------------------------------- */
const app = document.getElementById("app");

function render(){
  saveUiState();
  const prevView = render._lastView;
  const scrollY = window.scrollY;
  let html = "";
  if(ui.view === "home") html = renderHome();
  else if(ui.view === "import") html = renderImport();
  else if(ui.view === "transcript") html = renderTranscript();
  else if(ui.view === "review") html = renderReview();

  html += renderModals();
  if(ui.toast) html += `<div class="toast">${esc(ui.toast)}</div>`;

  app.innerHTML = html;
  bindEvents();

  // Rebuilding the whole DOM on every state change (checkbox toggle, difficulty
  // change, etc.) drops the browser's scroll position — restore it so in-place
  // updates don't jump the page. Only skip this when the view actually changed
  // (e.g. opening a project), where landing at the top is correct.
  if(prevView === ui.view) window.scrollTo(0, scrollY);
  render._lastView = ui.view;
}

/* ---------- Review ---------- */
const FILTERS = [
  { key:"pending", label:"Pending" },
  { key:"approved", label:"Approved" },
  { key:"easy", label:"Easy" },
  { key:"medium", label:"Medium" },
  { key:"hard", label:"Hard" },
];

const EPISODE_FILTERS = [
  { key:"all", label:"All (play order)" },
  { key:"pending", label:"Pending" },
  { key:"approved", label:"Approved" },
];
function activeFilters(){ return ui.reviewEpisode === null ? FILTERS : EPISODE_FILTERS; }

function filteredQuestions(project, dupMap){
  const search = ui.searchQuery.trim().toLowerCase();
  return scopeQuestions(project).filter(q=>{
    if(ui.filter==="duplicates"){
      if(!dupMap.has(q.id)) return false;
    }else if(ui.filter!=="all"){
      if(ui.filter==="pending" && q.status!=="pending") return false;
      if(ui.filter==="approved" && q.status!=="approved") return false;
      if(ui.filter!=="pending" && ui.filter!=="approved" && q.difficulty!==ui.filter) return false;
    }
    if(search){
      const haystack = [q.question, ...q.options, q.answer, q.context || "", q.description || ""].join(" ").toLowerCase();
      if(!haystack.includes(search)) return false;
    }
    return true;
  });
}

function filterCount(project, key){
  const list = scopeQuestions(project);
  if(key==="all") return list.length;
  if(key==="pending") return list.filter(q=>q.status==="pending").length;
  if(key==="approved") return list.filter(q=>q.status==="approved").length;
  return list.filter(q=>q.difficulty===key).length;
}

// Maps question id -> array of *other* questions in the project that share the same answer text.
// Scoped to the current review scope — for episodes that's one episode, so the
// same answer in two different episodes isn't flagged.
function getDuplicateAnswerMap(project){
  const groups = {};
  scopeQuestions(project).forEach(q=>{
    const key = (q.answer || "").trim().toLowerCase();
    if(!key) return;
    (groups[key] = groups[key] || []).push(q);
  });
  const map = new Map();
  Object.values(groups).forEach(group=>{
    if(group.length < 2) return;
    group.forEach(q=> map.set(q.id, group.filter(o=>o.id!==q.id)));
  });
  return map;
}

function renderReview(){
  const project = getProject(ui.projectId);
  if(!project) return renderHome();
  const h = getHistory(project.id);
  const dupMap = getDuplicateAnswerMap(project);
  // A remembered episode that no longer exists falls back to regular questions.
  if(ui.reviewEpisode !== null && !projectEpisodes(project).includes(ui.reviewEpisode)){ ui.reviewEpisode = null; }
  const epScope = ui.reviewEpisode !== null;
  if(!activeFilters().some(f=>f.key===ui.filter) && ui.filter!=="duplicates") ui.filter = epScope ? "all" : "pending";
  const list = filteredQuestions(project, dupMap);
  const scoped = scopeQuestions(project);
  const pendingCount = scoped.filter(q=>q.status==="pending").length;
  const approvedCount = scoped.filter(q=>q.status==="approved").length;
  const dupCount = dupMap.size;
  // Arrows only when the whole episode is on screen, so a move can't jump past hidden questions.
  const canReorder = epScope && ui.filter==="all" && !ui.searchQuery.trim() && !ui.selectMode;
  const eps = projectEpisodes(project);
  const scopeBar = eps.length ? `
    <div class="review-toolbar">
      <span style="font-size:12.5px; color:var(--text-dim);">Showing:</span>
      <div class="filter-group">

        ${eps.map(ep=>`<button class="btn btn-sm ${ui.reviewEpisode===ep?"active":""}" data-action="set-review-episode" data-ep="${ep}">🎬 Ep ${ep} (${scopeQuestions(project, ep).length})</button>`).join("")}
      </div>
    </div>` : "";

  return `
  ${topbar(project.name)}
  <div class="container">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search questions, options, or answers…" value="${esc(ui.searchQuery)}">
      ${ui.searchQuery ? `<button class="btn btn-sm btn-ghost" data-action="clear-search">✕ Clear</button>` : ""}
    </div>
    ${scopeBar}
    <div class="review-toolbar">
      <button class="btn btn-sm btn-dupe ${dupCount?"has-dupes":""} ${ui.filter==="duplicates"?"active":""}" data-action="set-filter" data-filter="duplicates">⚠️ Duplicates (${dupCount})</button>
      <div class="filter-group">
        ${activeFilters().map(f=>`<button class="btn btn-sm ${ui.filter===f.key?"active":""}" data-action="set-filter" data-filter="${f.key}">${f.label} (${filterCount(project,f.key)})</button>`).join("")}
      </div>
      <span class="count-pill">${pendingCount} pending · ${approvedCount} approved</span>
      <div class="toolbar-spacer"></div>
      <button class="btn btn-sm ${ui.selectMode?"active":""}" data-action="toggle-select-mode">☑ Select</button>
      ${epScope ? "" : `<button class="btn btn-sm" data-action="open-manual-add">➕ Add Questions Manually</button>`}
      <button class="btn btn-sm" data-action="undo" ${h.undo.length? "":"disabled"}>↶ Undo</button>
      <button class="btn btn-sm" data-action="redo" ${h.redo.length? "":"disabled"}>↷ Redo</button>
      <button class="btn btn-sm" data-action="open-trash">🗑 Trash (${project.trash.length})</button>
    </div>

    ${ui.selectMode ? `
    <div class="bulk-toolbar">
      <button class="btn btn-sm" data-action="select-all">Select All (${list.length})</button>
      <button class="btn btn-sm btn-ghost" data-action="clear-selection">Clear</button>
      <span class="count-pill">${ui.selectedIds.size} selected</span>
      ${epScope ? "" : `<select id="bulkDiffSelect">
        <option value="">Set difficulty…</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button class="btn btn-sm" data-action="bulk-set-difficulty" ${ui.selectedIds.size?"":"disabled"}>Apply</button>`}
      <button class="btn btn-sm btn-primary" data-action="bulk-approve" ${ui.selectedIds.size?"":"disabled"}>✓ Approve Selected</button>
      <button class="btn btn-sm btn-danger" data-action="bulk-delete" ${ui.selectedIds.size?"":"disabled"}>🗑 Delete Selected</button>
    </div>` : ""}

    <div class="qlist">
      ${epScope && !canReorder && list.length ? `<div class="chat-context">↑↓ reorder arrows appear under "All (play order)" with no search or selection active, so a move can't skip past hidden questions.</div>` : ""}
      ${list.length ? list.map((q,i)=>renderQuestionCard(project, q, scoped.indexOf(q), dupMap.get(q.id), canReorder, scoped)).join("") : `<div class="empty-state">${ui.filter==="duplicates" ? "No duplicate answers found — nothing repeats across your questions." : `No questions match${ui.searchQuery?" your search":" this filter"}.`}</div>`}
    </div>
  </div>`;
}

  return `
    <div class="filter-group" style="margin-bottom:10px; flex-wrap:wrap;">
      ${eps.map(ep=>{
        const all = scopeQuestions(project, ep); const ok = all.filter(q=>q.status==="approved").length;

    ${out.count ? `<textarea class="export-json" readonly>${esc(out.text)}</textarea>` : `<div class="empty-state">No approved questions in the selected episodes yet.</div>`}`;
}

/* ---------------------------------------------------------------------
   Event delegation
--------------------------------------------------------------------- */
function bindEvents(){
  app.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", onAction);
  });
  const settingsBtn = document.getElementById("saveFlash");
  const apiKeyInput = document.getElementById("apiKeyInput");
  if(apiKeyInput){
    apiKeyInput.addEventListener("keydown", e=>{ if(e.key==="Enter") saveSettings(); });
  }
  const chatInput = document.getElementById("chatInput");
  if(chatInput){
    chatInput.addEventListener("input", e=>{ ui.chatDraft = e.target.value; });
    chatInput.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); triggerSendChat(); }
    });
    chatInput.focus();
    chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
  }
  const importText = document.getElementById("importText");
  if(importText) importText.addEventListener("input", e=>{ ui._importDraft = e.target.value; });
  const transcriptText = document.getElementById("transcriptText");
  if(transcriptText){
    transcriptText.addEventListener("input", e=>{
      const project = getProject(ui.projectId);
      if(project){ project.transcriptDraft = e.target.value; scheduleDraftSave(); }
    });
  }
  const episodeNumberInput = document.getElementById("episodeNumberInput");
  if(episodeNumberInput) episodeNumberInput.addEventListener("input", e=>{ ui.episodeNumberDraft = e.target.value; });
  const addAfterInput = document.getElementById("addAfterInput");
  if(addAfterInput){
    addAfterInput.addEventListener("input", e=>{ ui.addAfterDraft = e.target.value; });
    addAfterInput.addEventListener("keydown", e=>{
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); document.querySelector('[data-action="send-add-after"]')?.click(); }
    });
    addAfterInput.focus();
  }
  document.querySelectorAll(".export-ep-cb").forEach(cb=>{
    cb.addEventListener("click", e=>e.stopPropagation());
    cb.addEventListener("change", ()=>{
      const project = getProject(ui.projectId);
      if(!ui.exportEpisodes) ui.exportEpisodes = new Set(projectEpisodes(project));
      const ep = Number(cb.dataset.ep);
      if(cb.checked) ui.exportEpisodes.add(ep); else ui.exportEpisodes.delete(ep);
      render();
    });
  });
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", e=>{
      ui.searchQuery = e.target.value;
      render();
      const el = document.getElementById("searchInput");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  const manualAddText = document.getElementById("manualAddText");
  if(manualAddText){
    manualAddText.addEventListener("input", e=>{
      const project = getProject(ui.projectId);
      if(project){ project.manualDraft = e.target.value; scheduleDraftSave(); }
    });
    manualAddText.focus();
    manualAddText.setSelectionRange(manualAddText.value.length, manualAddText.value.length);
  }
  const newProjName = document.getElementById("newProjectName");
  if(newProjName){
    newProjName.focus();
    newProjName.addEventListener("keydown", e=>{ if(e.key==="Enter") createProject(); });
  }
  document.querySelectorAll(".diff-select").forEach(sel=>{
    sel.addEventListener("click", e=>e.stopPropagation());
    sel.addEventListener("change", e=>{
      const project = getProject(ui.projectId);
      setDifficulty(project, sel.dataset.id, sel.value);
    });
  });
  document.querySelectorAll(".select-checkbox").forEach(cb=>{
    cb.addEventListener("click", e=>e.stopPropagation());
    cb.addEventListener("change", ()=>{
      if(cb.checked) ui.selectedIds.add(cb.dataset.id);
      else ui.selectedIds.delete(cb.dataset.id);
      render();
    });
  });
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const project = ui.projectId ? getProject(ui.projectId) : null;

  switch(action){
    case "go-home": ui.view="home"; ui.projectId=null; render(); break;
    case "go-import": ui.view="import"; render(); break;
    case "go-transcript": ui.view="transcript"; ui.transcriptMsg = null; render(); break;
    case "go-review": ui.view="review"; render(); break;
    case "open-project": ui.projectId = id; ui.view="review"; ui.filter="pending"; ui.reviewEpisode=null; ui.addAfterId=null; ui.selectMode=false; ui.selectedIds=new Set(); render(); break;

    case "new-project": ui.newProjectOpen = true; render(); break;
    case "close-new-project": ui.newProjectOpen = false; render(); break;
    case "create-project": createProject(); break;

    case "save-settings": saveSettings(); break;
    case "delete-style-note": state.styleNotes.splice(Number(el.dataset.idx),1); persist(); render(); break;

    case "upload": doUpload(project); break;
    case "set-transcript-count": ui.transcriptCount = Number(el.dataset.count); render(); break;
    case "generate-transcript": generateTranscriptQuestions(project); break;
    case "set-transcript-mode": ui.transcriptMode = el.dataset.mode; ui.transcriptMsg = null; render(); break;
    case "set-episode-model": state.episodeModel = el.dataset.model; persist(); render(); break;
    case "generate-episode": generateEpisodeQuestions(project); break;
    case "set-review-episode":
      ui.reviewEpisode = el.dataset.ep === "" ? null : Number(el.dataset.ep);
      ui.filter = ui.reviewEpisode === null ? "pending" : "all";
      ui.selectedIds = new Set(); ui.addAfterId = null; ui.editingId = null;
      render(); break;
    case "move-up": moveQuestion(project, id, -1); break;
    case "move-down": moveQuestion(project, id, 1); break;
    case "open-add-after": ui.addAfterId = (ui.addAfterId===id ? null : id); ui.addAfterDraft = ""; render(); break;
    case "send-add-after": {
      const q = project.questions.find(x=>x.id===id);
      const input = document.getElementById("addAfterInput");
      if(q) addQuestionAfter(project, q, input ? input.value : ui.addAfterDraft);
      break;
    }
    case "set-export-tab": ui.exportTab = el.dataset.tab; render(); break;

    case "set-filter": ui.filter = el.dataset.filter; render(); break;
    case "undo": undo(project); render(); break;
    case "redo": redo(project); render(); break;

    case "edit": ui.editingId = id; render(); break;
    case "cancel-edit": ui.editingId = null; render(); break;
    case "save-edit": doSaveEdit(project, id); break;

    case "approve": approveQuestion(project, id); afterListAction(); break;
    case "delete": deleteQuestion(project, id); afterListAction(); break;
    case "restore": restoreQuestion(project, id); render(); break;

    case "ai-options": { const q = project.questions.find(x=>x.id===id); runAiOptions(project, q); break; }
    case "rephrase": { const q = project.questions.find(x=>x.id===id); runRephrase(project, q); break; }

    case "google": { const q = project.questions.find(x=>x.id===id);
      window.open(`https://www.google.com/search?q=${encodeURIComponent(q.question + " " + project.name)}`, "_blank", "noopener");
      break; }

    case "open-chat": ui.chatQuestionId = (ui.chatQuestionId===id ? null : id); ui.chatDraft = ""; render(); break;
    case "send-chat": triggerSendChat(); break;

    case "open-trash": ui.showTrash = true; render(); break;
    case "close-trash": ui.showTrash = false; render(); break;
    case "clear-trash": clearTrash(project); render(); break;

    case "open-export": ui.showExport = true; render(); break;
    case "close-export": ui.showExport = false; render(); break;
    case "copy-export": doCopyExport(project); break;

    case "open-storage": ui.showStorage = true; render(); break;
    case "close-storage": ui.showStorage = false; render(); break;
    case "open-style-notes": ui.showStyleNotes = true; render(); break;
    case "close-style-notes": ui.showStyleNotes = false; render(); break;
    case "delete-project": deleteProject(id); break;
    case "archive-project": archiveProject(id); break;
    case "unarchive-project": unarchiveProject(id); break;
    case "open-archived": ui.showArchived = true; render(); break;
    case "close-archived": ui.showArchived = false; render(); break;

    case "clear-search": ui.searchQuery = ""; render(); break;

    case "toggle-select-mode": ui.selectMode = !ui.selectMode; if(!ui.selectMode) ui.selectedIds = new Set(); render(); break;
    case "select-all": {
      const dupMap = getDuplicateAnswerMap(project);
      filteredQuestions(project, dupMap).forEach(q=>ui.selectedIds.add(q.id));
      render(); break;
    }
    case "clear-selection": ui.selectedIds = new Set(); render(); break;
    case "bulk-approve": bulkApprove(project); break;
    case "bulk-delete": bulkDeleteSelected(project); break;
    case "bulk-set-difficulty": {
      const sel = document.getElementById("bulkDiffSelect");
      bulkSetDifficulty(project, sel?.value);
      break;
    }

    case "open-manual-add": ui.showManualAdd = true; render(); break;
    case "close-manual-add": flushDraftSave(); ui.showManualAdd = false; render(); break;
    case "generate-manual": generateManualQuestions(project); break;

    case "close-modal-bg":
      if(e.target === el){
        if(ui.showManualAdd) flushDraftSave();
        ui.newProjectOpen = false; ui.showTrash = false; ui.showExport = false; ui.showStorage = false; ui.showManualAdd = false; ui.showArchived = false; ui.showStyleNotes = false;
        render();
      }
      break;
  }
}

function afterListAction(){
