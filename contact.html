<!DOCTYPE html>
<html lang="en">
<head>
<script>if(/TriviaGauntletPremium/.test(navigator.userAgent||''))document.documentElement.classList.add('premium-app');</script>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contact - TriviaGauntlet</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E6BY9F2ZDT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  if(!/TriviaGauntletPremium/.test(navigator.userAgent||''))gtag('config', 'G-E6BY9F2ZDT');
</script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<main class="container narrow">
  <a href="index.html" class="back-link" onclick="if (history.length > 1) { history.back(); return false; }">← Back</a>

  <section class="panel">
    <h1>Contact / Feedback</h1>
    <p>
      Found a wrong question, want to request a pack not currently in the shop, spotted a bug, or just want to share feedback? Send it here.
    </p>

    <p class="contact-alt">
      Or email directly:
      <a class="upload-link" href="mailto:triviaking2025@gmail.com?subject=Trivia%20Gauntlet%20Feedback">triviaking2025@gmail.com</a>
    </p>

    <form class="contact-form" id="contactForm">
      <label class="form-label" for="feedbackType">Type</label>
      <select id="feedbackType" name="type" class="form-input">
        <option value="general">General Feedback</option>
        <option value="pack">Request a Theme Pack</option>
        <option value="question">Wrong Question / Answer</option>
        <option value="bug">Bug / Technical Issue</option>
        <option value="suggestion">Suggestion</option>
      </select>

      <label class="form-label" for="message">Message</label>
      <textarea
        id="message"
        name="message"
        class="form-input form-textarea"
        placeholder="Type your feedback here..."
        required
      ></textarea>

      <label class="form-label" for="email">Email (optional)</label>
      <input
        id="email"
        name="email"
        type="email"
        class="form-input"
        placeholder="you@example.com"
      />

      <button type="submit" class="primary-btn" id="contactSendBtn">Send Feedback</button>
    </form>
    <p id="contactSentMsg" style="display:none;color:#4ade80;font-weight:600;margin-top:12px;">✓ Feedback sent — thank you!</p>
  </section>
</main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="about.html">About</a>
        <a class="footer-highlight" href="how-it-works.html">How It Works</a>
        <a class="footer-highlight" href="contact.html">Contact</a>
        <a class="footer-highlight" href="blog.html">Blog</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms</a>
      </div>
    </div>
  </footer>
    <script src="assets/app.js"></script>
  <script src="assets/remove-ads.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const topic = params.get("topic");
    const subjectSelect = document.getElementById("feedbackType");

    if (topic && subjectSelect) {
      subjectSelect.value = topic;
    }

    const form = document.getElementById("contactForm");
    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("contactSendBtn");
      const message = document.getElementById("message").value.trim();
      if (!message) return;
      const type = document.getElementById("feedbackType").value;
      const email = document.getElementById("email").value.trim();
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        await fetch("https://formspree.io/f/mpqybwea", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ type, message, email, _subject: "Trivia Gauntlet Feedback" }),
        });
        form.style.display = "none";
        document.getElementById("contactSentMsg").style.display = "block";
        if (typeof gtag === "function") gtag("event", "contact_feedback_sent", { type });
      } catch {
        btn.textContent = "Failed — try again";
        btn.disabled = false;
      }
    });
  });
</script>
  <script src="assets/profile.js"></script>
</body>
</html>
