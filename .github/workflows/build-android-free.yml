name: Build Android Free App

# Signed release bundle (.aab) of the free Capacitor app (com.trivia.trivia_gauntlet),
# saved as a downloadable artifact to upload in Play Console. Needs secrets:
#   ANDROID_KEYSTORE_BASE64   (the upload keystore .jks, base64)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         (key0)
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown in Play (e.g. 1.7)'
        required: true
        default: '1.7'
      version_code:
        description: 'Build number — must be higher than the last one uploaded to Play'
        required: true
        default: '15'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install npm packages + sync Capacitor
        run: |
          npm ci
          npx cap sync android
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}
      - name: Upload .aab
        uses: actions/upload-artifact@v4
        with:
          name: trivia-gauntlet-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
