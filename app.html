<!DOCTYPE html>
<html lang="en">
<head>
<script>if(/TriviaGauntletPremium/.test(navigator.userAgent||''))document.documentElement.classList.add('premium-app');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Get Trivia Gauntlet</title>
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E6BY9F2ZDT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    if(!/TriviaGauntletPremium/.test(navigator.userAgent||''))gtag('config', 'G-E6BY9F2ZDT');
  </script>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #15151f; color: #fff; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; gap: 18px; }
    img.logo { width: 88px; height: 88px; border-radius: 20px; }
    h1 { margin: 0; font-size: 1.4em; }
    p { margin: 0; opacity: .85; }
    .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
    a.store { display: block; padding: 14px 20px; border-radius: 12px; background: #6c63ff; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/icon-192.png" alt="Trivia Gauntlet" />
    <h1>Trivia Gauntlet</h1>
    <p id="msg">Opening your app store…</p>
    <div class="btns">
      <a class="store" id="ios" href="https://apps.apple.com/app/trivia-gauntlet/id6749189557">Download free on iOS</a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.trivia.trivia_gauntlet">Download free on Android</a>
    </div>
  </div>
  <script>
    (function () {
      var APPLE_PROVIDER_TOKEN = 'YOUR_PT_TOKEN'; // same value used on the bio-link page
      var source = new URLSearchParams(location.search).get('utm_source') || 'direct';

      var iosUrl = new URL('https://apps.apple.com/app/trivia-gauntlet/id6749189557');
      iosUrl.searchParams.set('pt', APPLE_PROVIDER_TOKEN);
      iosUrl.searchParams.set('ct', source);
      iosUrl.searchParams.set('mt', '8');

      var androidUrl = new URL('https://play.google.com/store/apps/details?id=com.trivia.trivia_gauntlet');
      androidUrl.searchParams.set('referrer', 'utm_source=' + source + '&utm_medium=social&utm_campaign=' + source);

      document.getElementById('ios').href = iosUrl.toString();
      document.getElementById('android').href = androidUrl.toString();

      var ua = navigator.userAgent || '';
      var isIos     = /iphone|ipad|ipod/i.test(ua);
      var isAndroid = /android/i.test(ua);
      var target = isIos ? iosUrl.toString() : isAndroid ? androidUrl.toString() : null;

      if (target) {
        gtag('event', 'store_redirect', { store_platform: isIos ? 'ios' : 'android', utm_source: source });
        // Small delay so the GA4 beacon has time to send before we navigate away.
        setTimeout(function () { window.location.replace(target); }, 400);
      } else {
        document.getElementById('msg').textContent = 'Get Trivia Gauntlet free on your phone:';
      }
    })();
  </script>
</body>
</html>
